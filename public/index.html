const RSORT_KEY = {
  id:       r=>r.id,
  type:     r=>r.type,
  subject:  r=>r.subject,
  created:  r=>r.created,
  prio:     r=>PRIO_ORDER[r.prio],
  progress: r=>RPROG_ORDER[r.progress],
  applicant:r=>(USERS[r.applicant]||{}).name||'',
  unit:     r=>r.unit,
};
const RSORT_INV = {prio:1, progress:1};
const RSORT_LABEL = {id:'請求編號',type:'請求類型',subject:'申請主題',created:'創建時間',
                     prio:'優先等級',progress:'辦理進度',applicant:'申請者',unit:'受檢單位'};

function nextReqId(type){
  const n=REQUESTS.filter(r=>r.type===type)
    .map(r=>parseInt(r.id.slice(-4),10)).filter(x=>!isNaN(x));
  return `${type}-${String(Math.max(0,...n)+1).padStart(4,'0')}`;
}

function reqFiltered(){
  const q=S.rq.trim().toLowerCase();
  const rows=REQUESTS.filter(r=>{
    if(S.rType!=='全部'&&r.type!==S.rType)return false;
    if(S.rPrio!=='全部'&&r.prio!==S.rPrio)return false;
    if(S.rProg!=='全部'&&r.progress!==S.rProg)return false;
    if(!q)return true;
    const d=RDETAIL[r.id]||{};
    return [r.id,r.type,r.subject,r.unit,(USERS[r.applicant]||{}).name||'',d.desc||'',d.reply||'']
      .join(' ').toLowerCase().includes(q);
  });
  const get=RSORT_KEY[S.rSortBy]||RSORT_KEY.created;
  let dir=S.rSortDir==='desc'?-1:1;
  if(RSORT_INV[S.rSortBy]) dir*=-1;
  const coll=new Intl.Collator('zh-Hant',{numeric:true});
  rows.sort((a,b)=>{
    const av=get(a), bv=get(b);
    const r=(typeof av==='number')?av-bv:coll.compare(av,bv);
    return r*dir || coll.compare(a.id,b.id);
  });
  return rows;
}

function rSortTh(key,label){
  return el('th',{class:'sortable','data-rkey':key,
    onclick:()=>{ if(S.rSortBy===key)S.rSortDir=S.rSortDir==='desc'?'asc':'desc';
                  else {S.rSortBy=key;S.rSortDir='desc';}
      S.rPage=1; refreshReqTable(); }},
    label, el('span',{class:'arrow'},''));
}
function rChipGroup(key,opts){

function refreshReqTable(){
  const tb=$('#rbody'); if(!tb)return;
  const rows=reqFiltered();
  document.querySelectorAll('th[data-rkey]').forEach(t=>{
    const on=t.dataset.rkey===S.rSortBy;
    t.toggleAttribute('data-active', on);
    if(on) t.setAttribute('aria-sort', S.rSortDir==='desc'?'descending':'ascending');
    else t.removeAttribute('aria-sort');
    t.querySelector('.arrow').textContent = on ? (S.rSortDir==='desc'?'↓':'↑') : '';
  });

  const per=S.rPerPage==='all' ? rows.length||1 : S.rPerPage;
  const pages=Math.max(1, Math.ceil(rows.length/per));
  if(S.rPage>pages) S.rPage=pages;
  const start=(S.rPage-1)*per, slice=rows.slice(start,start+per);

  const note=$('#rsortnote');
  if(note){
    note.innerHTML='';
    note.append(
      el('span',{html:svgIcon(I.info), style:'display:grid;color:var(--ink-3)'}),
      el('span',{},`依「${RSORT_LABEL[S.rSortBy]||''}」${S.rSortDir==='desc'?'遞減':'遞增'}排序 · 符合 ${rows.length} 件`
        + (S.rSortBy==='created'&&S.rSortDir==='desc' ? '（預設）' : '')));
  }

  tb.innerHTML='';
  if(!rows.length){
    tb.append(el('tr',{},el('td',{colspan:8,class:'empty'},'沒有符合條件的請求表。調整篩選或清除搜尋關鍵字。')));
  }else{
    for(const r of slice){
      const u=USERS[r.applicant]||{name:'（已移除帳號）',role:'—'};
      const d=RDETAIL[r.id]||{};
      tb.append(el('tr',{onclick:()=>goReq(r.id), tabindex:'0',
        onkeydown:e=>{if(e.key==='Enter')goReq(r.id);}},
        el('td',{class:'sev-cell'}, el('i',{style:`background:${PRIO_COLOR[r.prio]}`})),
        el('td',{}, el('span',{class:`rtype rtype-${r.type}`},r.type),
                    el('div',{class:'cid', style:'margin-top:3px'},r.id)),
        el('td',{},
          el('div',{class:'ctitle'},r.subject),
          el('div',{class:'ctags'},
            d.reply ? el('span',{class:'tag tag-replied'},'已回覆')
                    : el('span',{class:'tag'},'尚無回覆'),
            (d.shots&&d.shots.length) ? el('span',{class:'tag'},`附圖 ${d.shots.length}`) : null)),
        el('td',{}, el('span',{style:'font-size:12.5px'},r.unit)),
        el('td',{}, el('span',{class:'tnum'},r.created)),
        el('td',{}, el('span',{class:'chip','data-s':r.prio}, el('i',{class:'dot'}), r.prio)),
        el('td',{}, el('span',{class:'chip','data-rp':r.progress}, el('i',{class:'dot'}), r.progress)),
        el('td',{}, el('div',{class:'who'},
          el('span',{class:'avatar'},initials(u)),
          el('span',{},u.name, el('small',{},u.role))))));
    }
  }
  pagerInto('#rpager', rows.length, pages, start, slice.length, S.rPerPage,
    p=>{S.rPage=p; refreshReqTable(); const t=$('#req-table'); if(t)t.scrollIntoView({block:'start',behavior:'smooth'});},
    v=>{S.rPerPage=v; S.rPage=1; refreshReqTable();},
    S.rPage);
}

function deleteReq(id){
  const r=REQUESTS.find(x=>x.id===id); if(!r)return;
  const i=REQUESTS.indexOf(r);
  REQUESTS.splice(i,1); delete RDETAIL[id];
  persist(); S.reqId=null; go('dashboard');
  toast(`已刪除請求表 ${id}`);
}

function rqPreview(which,on){
  const ta=$(`#rq-${which}`), pv=$(`#rq-${which}-preview`); if(!ta||!pv)return;
  ta.classList.toggle('hidden',on); pv.classList.toggle('hidden',!on);
  if(on) pv.innerHTML = ta.value.trim() ? md(ta.value)
    : '<p style="color:var(--ink-3)">尚未輸入內容。</p>';
  const tabs=ta.closest('.sec').querySelectorAll('.md-tab');
  tabs.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===(on?1:0))));
}

async function addReqFiles(files){
  let added=0; const rejected=[];
  for(const f of files){
    if(S.rform.shots.length>=MAX_SHOTS){ rejected.push(`已達 ${MAX_SHOTS} 張上限，其餘未加入`); break; }
    if(!OK_TYPES.includes(f.type)){ rejected.push(`${f.name} 不是 PNG／JPG／WebP，未加入`); continue; }
    if(f.size>MAX_BYTES){ rejected.push(`${f.name} 超過 10 MB，未加入`); continue; }
    S.rform.shots.push({name:f.name, size:f.size, url:await toThumbURL(f)});
    added++;
  }
  renderReqShots();
  if(rejected.length) toast(rejected[0]);
  else if(added) toast(`已加入 ${added} 張附圖`);
}

function renderReqShots(){
  const host=$('#rq-shot-list'); if(!host)return;
  host.innerHTML='';
  if(!S.rform.shots.length){
    host.append(el('p',{style:'font-size:12px;color:var(--ink-3)'},'尚未加入任何附圖。'));
    return;
  }
  host.append(
    el('p',{style:'font-size:11.5px;color:var(--ink-3);margin-bottom:9px'},
      `${S.rform.shots.length} / ${MAX_SHOTS} 張`),

        onclick:()=>{ if(s.url&&s.url.startsWith('blob:'))URL.revokeObjectURL(s.url);
                      S.rform.shots.splice(i,1); renderReqShots(); },
        html:svgIcon(I.trash)}),

        el('div',{class:'u-name'},s.name),
        el('div',{class:'u-size'}, s.size?fmtBytes(s.size):'既有附圖'))))));

function saveReq(draft){
  const val=sel=>{ const n=$(sel); return n?n.value.trim():''; };
  const pick=name=>{ const n=document.querySelector(`input[name="${name}"]:checked`); return n?n.value:''; };
  const fail=(m,sel)=>{ toast(m); const n=sel&&$(sel); if(n){n.focus(); n.scrollIntoView({block:'center',behavior:'smooth'});} return null; };

  const subject=val('#rq-subject');
  if(!subject) return fail('請填寫申請主題','#rq-subject');
  const unit=val('#rq-unit');
  if(!unit) return fail('請填寫受檢單位','#rq-unit');
  const desc=val('#rq-desc');
  if(!draft && !desc) return fail('請填寫說明；若尚未寫完可先「儲存草稿」','#rq-desc');

  const type=pick('rtype')||'RFI';
  const editing=!!S.reqId;
  const prev=editing ? REQUESTS.find(x=>x.id===S.reqId) : null;
  // 類型改變時編號必須跟著重配，否則 CR 會頂著 RFI 的號
  const id = editing ? (prev.type===type ? prev.id : nextReqId(type)) : nextReqId(type);
  const reply=val('#rq-reply');

  const rec={
    id, type, subject, unit,
    prio:pick('rprio')||'中',
    progress: draft ? '未提交' : (pick('rprog')||'未提交'),
    applicant: editing ? prev.applicant : S.me,
    created: editing ? prev.created : nowStamp(),
  };

  const me=USERS[S.me];
  const had=editing ? (RDETAIL[prev.id]?.reply||'') : '';
  const audit = editing ? [...(RDETAIL[prev.id]?.audit||[])] : [];
  if(!editing) audit.unshift({who:me.name, role:me.role, act:draft?'建立草稿':'建立請求表', when:nowStamp()});
  else if(reply && !had) audit.unshift({who:me.name, role:me.role, act:'貼回受檢單位回覆', when:nowStamp()});
  else audit.unshift({who:me.name, role:me.role, act:draft?'儲存草稿':'更新請求表內容', when:nowStamp()});

  if(editing && prev.id!==id) delete RDETAIL[prev.id];
  RDETAIL[id]={
    desc, reply,
    repliedAt: reply ? (had ? (RDETAIL[prev?.id]?.repliedAt||nowStamp()) : nowStamp()) : null,
    shots: S.rform.shots.map(s=>({cap:s.name, kind:s.kind||'log',
      url:(s.url && !s.url.startsWith('blob:')) ? s.url : null})),
    audit,
  };
  if(editing) Object.assign(prev, rec); else REQUESTS.push(rec);
  persist();

  S.rform={_loaded:false, shots:[]};
  S.reqId=id;
  toast(editing ? (draft?'草稿已儲存':'請求表已更新')
                : (draft?`草稿已建立（${id}）`:`請求表已建立（${id}），全隊可見`));
  go('detail');
}

function drawReqTrend(){
  const host=$('#rq-trend'); if(!host)return;
  const tip=$('#tip-rq');
  host.querySelectorAll('svg').forEach(n=>n.remove());
  const days=[];
  for(let i=13;i>=0;i--){
    const d=stamp(i,'00:00').slice(0,10);
    days.push({date:d, d:d.slice(5), v:REQUESTS.filter(r=>r.created.slice(0,10)===d).length});
  }
  const W=host.clientWidth||600, H=Math.max(210,host.clientHeight||210), P={t:12,r:12,b:26,l:30};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, max=Math.max(3,...days.map(x=>x.v));
  const X=i=>P.l+(iw*i)/(days.length-1), Y=v=>P.t+ih-(ih*v)/max;
  const s=sv('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,id:'chart-req-trend',role:'img','aria-label':'近 14 日請求建立量'});
  for(let g=0;g<=3;g++){
    const y=P.t+(ih*g)/3, v=Math.round(max-(max*g)/3);
    s.append(sv('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,stroke:CSSVAR('--grid'),'stroke-width':1}));
    const tx=sv('text',{x:P.l-8,y:y+3.5,'text-anchor':'end','font-size':10,fill:CSSVAR('--ink-3'),'font-family':'IBM Plex Mono, monospace'});
    tx.textContent=v; s.append(tx);
  }
  s.append(sv('path',{d:days.map((x,i)=>`${i?'L':'M'}${X(i)},${Y(x.v)}`).join(' ')
    +` L${X(days.length-1)},${P.t+ih} L${P.l},${P.t+ih} Z`, fill:CSSVAR('--data-fill')}));
  s.append(sv('path',{d:days.map((x,i)=>`${i?'L':'M'}${X(i)},${Y(x.v)}`).join(' '),
    fill:'none', stroke:CSSVAR('--data'),'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
  s.append(sv('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,stroke:CSSVAR('--axis'),'stroke-width':1}));
  days.forEach((x,i)=>{ if(i%3===0||i===days.length-1){
    const tx=sv('text',{x:X(i),y:H-8,'text-anchor':'middle','font-size':10,fill:CSSVAR('--ink-3'),'font-family':'IBM Plex Mono, monospace'});
    tx.textContent=x.d; s.append(tx);}});
  const li=days.length-1;
  s.append(sv('circle',{cx:X(li),cy:Y(days[li].v),r:4.5,fill:CSSVAR('--data'),stroke:CSSVAR('--surface'),'stroke-width':2}));
  const cross=sv('line',{x1:0,x2:0,y1:P.t,y2:P.t+ih,stroke:CSSVAR('--axis'),'stroke-width':1,opacity:0});
  const dot=sv('circle',{r:4.5,fill:CSSVAR('--data'),stroke:CSSVAR('--surface'),'stroke-width':2,opacity:0});
  s.append(cross,dot);
  s.append(sv('rect',{x:P.l,y:P.t,width:iw,height:ih,fill:'transparent'}));
  s.addEventListener('mousemove',e=>{
    const rc=s.getBoundingClientRect();
    let i=Math.round(((e.clientX-rc.left)-P.l)/(iw/(days.length-1)));
    i=Math.max(0,Math.min(days.length-1,i));
    const x=X(i), y=Y(days[i].v);
    cross.setAttribute('x1',x); cross.setAttribute('x2',x); cross.setAttribute('opacity',1);
    dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('opacity',1);
    tip.innerHTML=`<div class="t-d">${days[i].date}</div><div class="t-v">${days[i].v} 件</div>`;
    tip.style.left=x+'px'; tip.style.top=(y-12)+'px'; tip.style.opacity=1;
  });
  s.addEventListener('mouseleave',()=>{cross.setAttribute('opacity',0);dot.setAttribute('opacity',0);tip.style.opacity=0;});
  host.append(s);
}

function drawReqType(){
  const host=$('#rq-type'); if(!host)return;
  host.innerHTML='';
  const rfi=REQUESTS.filter(r=>r.type==='RFI').length;
  const cr=REQUESTS.length-rfi;
  const data=[{k:'RFI · 資訊請求', v:rfi, c:'var(--data)'},
              {k:'CR · 變更請求',  v:cr,  c:'var(--neutral-1)'}];
  const total=rfi+cr||1, W=host.clientWidth||300, H=34, gap=2;
  const s=sv('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,id:'chart-req-type',role:'img','aria-label':'請求類型分佈'});
  let x=0;
  data.forEach((d,i)=>{
    const w=Math.max(0,(W*d.v)/total-(i<data.length-1?gap:0));
    const rc=sv('rect',{x,y:0,width:w,height:H,rx:3,fill:d.c});
    const t=sv('title'); t.textContent=`${d.k} ${d.v} 件`; rc.append(t);
    s.append(rc); x+=w+gap;
  });
  host.append(s);
  const lg=$('#lg-rq-type'); lg.innerHTML='';
  data.forEach(d=>lg.append(el('span',{class:'lg'},
    el('i',{style:`background:${d.c}`}), el('span',{},d.k),
    el('b',{},`${d.v} · ${(d.v/total*100).toFixed(0)}%`))));
}

function drawReqPrio(){
  const host=$('#rq-prio'); if(!host)return;
  const tip=$('#tip-rq-prio');
  host.querySelectorAll('svg').forEach(n=>n.remove());
  const open=REQUESTS.filter(r=>r.progress!=='已完成');
  const data=['速件','高','中','低'].map(k=>({k, v:open.filter(r=>r.prio===k).length}));
  const W=host.clientWidth||300, rowH=30, H=data.length*rowH, labelW=48, valW=28;
  const bw=W-labelW-valW, max=Math.max(1,...data.map(d=>d.v));
  const s=sv('svg',{width:W,height:H,id:'chart-req-prio',role:'img','aria-label':'未結請求的優先等級分佈'});
  data.forEach((d,i)=>{
    const y=i*rowH+6, h=15, w=Math.max(2,(bw*d.v)/max);
    const lb=sv('text',{x:0,y:y+h-3,'font-size':11.5,fill:CSSVAR('--ink-2')});
    lb.textContent=d.k; s.append(lb);
    s.append(sv('rect',{x:labelW,y,width:bw,height:h,rx:3,fill:CSSVAR('--surface-3')}));
    const bar=sv('rect',{x:labelW,y,width:w,height:h,rx:3,fill:CSSVAR(
      d.k==='速件'?'--critical':d.k==='高'?'--serious':d.k==='中'?'--warning':'--good')});
    s.append(bar);
    const vl=sv('text',{x:W,y:y+h-3,'text-anchor':'end','font-size':11.5,fill:CSSVAR('--ink'),
      'font-family':'IBM Plex Mono, monospace','font-weight':500});
    vl.textContent=d.v; s.append(vl);
    const hit=sv('rect',{x:0,y:i*rowH,width:W,height:rowH,fill:'transparent'});
    hit.addEventListener('mouseenter',()=>{ bar.setAttribute('opacity','.75');
      tip.innerHTML=`<div class="t-d">${d.k}</div><div class="t-v">${d.v} 件未結</div>`;
      tip.style.left=(labelW+w/2)+'px'; tip.style.top=(i*rowH)+'px'; tip.style.opacity=1; });
    hit.addEventListener('mouseleave',()=>{bar.setAttribute('opacity','1'); tip.style.opacity=0;});
    s.append(hit);
  });
  host.append(s);
}

   資產管理系統

/* 綱目的 IP 欄以 IPv4 為主，沒有 IPv4 才顯示 IPv6 */
const primaryIp = a => a.ip ? {v:a.ip, kind:'IPv4'} : a.ipv6 ? {v:a.ipv6, kind:'IPv6'} : null;
/* 網段：有填就用填的，沒填才由 IPv4 推 /24，並標明是推定值 */
function subnetOf(a){
  if(a.cidr) return {v:a.cidr, guessed:false};
  const m=/^(\d+)\.(\d+)\.(\d+)\.\d+$/.exec(a.ip||'');
  return m ? {v:`${m[1]}.${m[2]}.${m[3]}.0/24`, guessed:true} : null;
}

const ASORT_KEY={
  id:a=>a.id, hostname:a=>a.hostname, device:a=>a.device,
  ip:a=>(primaryIp(a)||{v:'￿'}).v,
  vendor:a=>a.vendor||'￿', os:a=>a.os||'￿',
  location:a=>a.location, uplink:a=>a.uplink||'￿', vlan:a=>a.vlan||'￿',
  importance:a=>IMP_ORDER[a.importance],
  svc:a=>(ADETAIL[a.id]?.services||[]).length,
  vuln:a=>{ const n=vulnsOf(a).length; if(!n) return -1;
            return (3-(VUL_ORDER[worstVuln(a)]??3))*1000 + n + (urgentOf(a)?500:0); },
  analyst:a=>(USERS[a.analyst]||{}).name||'', created:a=>a.created,
};
const ASORT_INV={importance:1};   // 只有「重要性」是有序類別需要反轉；服務數與漏洞分數都是數量，遞減即最多在前
const ASORT_LABEL={id:'資產編號',hostname:'主機名稱',device:'設備名稱',ip:'IP',vendor:'製造商',
                   os:'作業系統',location:'位置',uplink:'上層設備',vlan:'VLAN',
                   importance:'重要性',svc:'服務數',vuln:'已知漏洞',analyst:'分析員',created:'建檔時間'};

const nextAssetId = () => `ASSET-${String(Math.max(0,...ASSETS.map(a=>parseInt(a.id.slice(-4),10)||0))+1).padStart(4,'0')}`;
const osFamily = os => !os ? '未填' : /Windows Server/i.test(os) ? 'Windows Server'
  : /Windows/i.test(os) ? 'Windows 用戶端' : /Ubuntu|Rocky|CentOS|Debian|Linux/i.test(os) ? 'Linux'
  : /FortiOS|IOS|PAN-OS|DSM/i.test(os) ? '網通／儲存設備' : '其他';
const assetIncomplete = a => !a.os || !(ADETAIL[a.id]?.services||[]).length;
/* 製造商國別直接從欄位字串判讀，不另設旗標——資料一改，標註就跟著改 */
const vendorCountry = a => (String(a.vendor||'').match(/[\uff08(]\s*([^\uff09)]+?)\s*[\uff09)]\s*$/)||[,''])[1];
const isPrcVendor   = a => /中國|中国|中華人民共和國|PRC|China/i.test(vendorCountry(a));
function allAssetTags(){
  const m=new Map();
  ASSETS.forEach(a=>a.tags.forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));
}

function assetFiltered(){
  const q=S.aq.trim().toLowerCase();
  const rows=ASSETS.filter(a=>{
    if(S.aImp!=='全部'&&a.importance!==S.aImp)return false;
    if(S.aOs!=='全部'&&osFamily(a.os)!==S.aOs)return false;
    if(S.aVul==='需立即修補' && !urgentOf(a)) return false;
    if(S.aVul==='有已知漏洞' && !vulnsOf(a).length) return false;
    if(S.aVul==='無已知漏洞' && vulnsOf(a).length) return false;
    if(S.aPrc && !isPrcVendor(a)) return false;
    if(S.aTags.length && !S.aTags.some(t=>a.tags.includes(t))) return false;
    if(!q)return true;
    const d=ADETAIL[a.id]||{};
    const svc=(d.services||[]).flatMap(x=>[x.name,x.port,x.version]);
    const vul=(d.vulns||[]).flatMap(v=>[v.cve,v.component,v.severity,v.note]);
    const fil=(d.files||[]).map(f=>f.name);
    return [a.id,a.hostname,a.device,a.vendor,a.ip,a.cidr,a.ipv6,a.mac,a.os,a.location,a.uplink,a.vlan,
            a.importance,d.purpose||'',...svc,...vul,...fil,...a.tags,
            (USERS[a.analyst]||{}).name||''].join(' ').toLowerCase().includes(q);
  });
  const get=ASORT_KEY[S.aSortBy]||ASORT_KEY.importance;
  let dir=S.aSortDir==='desc'?-1:1;
  if(ASORT_INV[S.aSortBy]) dir*=-1;
  const coll=new Intl.Collator('zh-Hant',{numeric:true});
  rows.sort((a,b)=>{
    const av=get(a), bv=get(b);
    const r=(typeof av==='number')?av-bv:coll.compare(av,bv);
    return r*dir || coll.compare(a.hostname,b.hostname);
  });
  return rows;
}

function refreshAssetTable(){
  const tb=$('#abody'); if(!tb)return;
  const rows=assetFiltered();
  document.querySelectorAll('th[data-akey]').forEach(t=>{
    const on=t.dataset.akey===S.aSortBy;

    if(on) t.setAttribute('aria-sort', S.aSortDir==='desc'?'descending':'ascending');
    else t.removeAttribute('aria-sort');
    t.querySelector('.arrow').textContent = on ? (S.aSortDir==='desc'?'↓':'↑') : '';
  });
  const per=S.aPerPage==='all'?rows.length||1:S.aPerPage;
  const pages=Math.max(1,Math.ceil(rows.length/per));
  if(S.aPage>pages) S.aPage=pages;
  const start=(S.aPage-1)*per, slice=rows.slice(start,start+per);

  const note=$('#asortnote');
  if(note){ note.innerHTML='';
    note.append(el('span',{html:svgIcon(I.info), style:'display:grid;color:var(--ink-3)'}),
      el('span',{},`依「${ASORT_LABEL[S.aSortBy]||''}」${S.aSortDir==='desc'?'遞減':'遞增'}排序 · 符合 ${rows.length} 項`

  if(!rows.length){
    tb.append(el('tr',{},el('td',{colspan:9,class:'empty'},'沒有符合條件的資產。調整篩選或清除搜尋關鍵字。')));

function exportAssets(){
  const data=JSON.stringify({schema:'asset-inventory/v1', generatedAt:nowStamp(),
    count:ASSETS.length, assets:ASSETS.map(assetPayload)}, null, 2);
  copyText(data, `已複製 ${ASSETS.length} 筆資產的 JSON 到剪貼簿`);
}
function copyText(text, okMsg){
  const done=()=>toast(okMsg);
  if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;left:-9999px';
    document.body.append(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('複製失敗，請手動選取'); }
    ta.remove();
  }
}

function saveAsset(){
  const val=s=>{const n=$(s); return n?n.value.trim():'';};
  const pick=n=>{const x=document.querySelector(`input[name="${n}"]:checked`); return x?x.value:'';};
  const hostname=val('#as-host');
  if(!hostname){ toast('請填寫主機名稱'); $('#as-host').focus(); return; }
  const editing=!!S.assetId;
  const prev=editing?ASSETS.find(x=>x.id===S.assetId):null;
  const dup=ASSETS.find(x=>x.hostname.toLowerCase()===hostname.toLowerCase() && x.id!==(prev?.id));
  if(dup){ toast(`主機名稱「${hostname}」已存在於 ${dup.id}，請確認是否重複建檔`); $('#as-host').focus(); return; }

  const id=editing?prev.id:nextAssetId();
  const rec={ id, hostname, device:val('#as-dev'), vendor:val('#as-vendor'),
    ip:val('#as-ip'), cidr:val('#as-cidr'), ipv6:val('#as-ipv6'), mac:val('#as-mac'), os:val('#as-os'),
    uplink:val('#as-uplink'), vlan:val('#as-vlan'),
    location:val('#as-loc'), importance:pick('aimp')||'中',
    analyst:editing?prev.analyst:S.me, tags:[...S.aform.tags],
    created:editing?prev.created:nowStamp() };

  const me=USERS[S.me];
  const audit=editing?[...(ADETAIL[id]?.audit||[])]:[];
  audit.unshift({who:me.name, role:me.role, act:editing?'更新資產資料':'建立資產資料', when:nowStamp()});
  ADETAIL[id]={ purpose:val('#as-purpose'),
    services:S.aform.services.filter(x=>x.name||x.port||x.version).map(x=>({...x})),
    vulns:S.aform.vulns.filter(x=>x.cve.trim()).map(x=>({...x, cve:x.cve.trim()})),
    files:S.aform.files.map(x=>({...x})), audit };

  if(editing) Object.assign(prev, rec); else ASSETS.push(rec);
  persist();
  S.aform=freshAform();
  S.assetId=id;
  toast(editing?'資產資料已更新':`資產已建立（${id}），全隊可見`);
  go('detail');
}


/* ---- 附件：組態檔與 log。存的是文字內容，讓隊員直接在頁面上讀，
       不必下載（Artifact 檢視器本來也擋下載）。 ---- */
const MAX_DOCS=10, MAX_DOC_BYTES=2*1024*1024, MAX_DOC_KEEP=200000;
const DOC_EXT=/\.(conf|cfg|txt|log|xml|json|ya?ml|ini|csv|md|rsc|nvram|bak)$/i;
const docKind = n => (n.match(/\.([a-z0-9]+)$/i)||[,'file'])[1].toLowerCase();

async function addAssetFiles(files){
  let added=0; const rejected=[];
  for(const f of files){
    if(S.aform.files.length>=MAX_DOCS){ rejected.push(`已達 ${MAX_DOCS} 個檔案上限，其餘未加入`); break; }
    if(!DOC_EXT.test(f.name)){ rejected.push(`${f.name} 不是支援的文字型檔案，未加入`); continue; }
    if(f.size>MAX_DOC_BYTES){ rejected.push(`${f.name} 超過 2 MB，未加入`); continue; }
    let text='';
    try{ text=await f.text(); }catch(e){ rejected.push(`${f.name} 讀取失敗，未加入`); continue; }
    const truncated=text.length>MAX_DOC_KEEP;
    S.aform.files.push({name:f.name, size:f.size, kind:docKind(f.name),
      text:truncated?text.slice(0,MAX_DOC_KEEP):text, truncated,
      lines:text.split('\n').length, at:nowStamp()});
    added++;
  }
  renderAssetFiles();
  if(rejected.length) toast(rejected[0]);
  else if(added) toast(`已加入 ${added} 個附件`);
}

function renderAssetFiles(){
  const host=$('#as-file-list'); if(!host)return;

  if(!S.aform.files.length){

/* ---- 漏洞嚴重程度圖 ---- */
function drawAssetVul(){
  const host=$('#as-vul'); if(!host)return;
  const tip=$('#tip-as-vul');
  host.querySelectorAll('svg').forEach(n=>n.remove());
  const order=['危急','高','中','低'];
  const data=order.map(k=>{
    const all=ASSETS.flatMap(a=>vulnsOf(a)).filter(v=>v.severity===k);
    return {k, v:all.length, urgent:all.filter(v=>v.urgent).length};
  });
  const W=host.clientWidth||300, avail=host.clientHeight||data.length*34;
  const rowH=Math.max(32, Math.min(52, Math.floor(avail/data.length)));
  const labelW=48, valW=52, bw=W-labelW-valW, max=Math.max(1,...data.map(d=>d.v));
  const s2=sv('svg',{width:W,height:data.length*rowH,id:'chart-asset-vuln',role:'img','aria-label':'已知漏洞嚴重程度分佈'});
  data.forEach((d,i)=>{
    const h=16, y=i*rowH+(rowH-h)/2, w=Math.max(2,(bw*d.v)/max);
    const uw=d.v?Math.max(0,w*d.urgent/d.v):0;
    const lb=sv('text',{x:0,y:y+h-3,'font-size':11.5,fill:CSSVAR('--ink-2')});
    lb.textContent=d.k; s2.append(lb);
    s2.append(sv('rect',{x:labelW,y,width:bw,height:h,rx:3,fill:CSSVAR('--surface-3')}));
    // 實心＝需立即修補，半透明＝依排程修補；顏色一律用該嚴重度的狀態色
    const col=CSSVAR(d.k==='危急'?'--critical':d.k==='高'?'--serious':d.k==='中'?'--warning':'--good');
    const bar=sv('rect',{x:labelW,y,width:w,height:h,rx:3,fill:col,opacity:'.4'});
    s2.append(bar);
    if(uw>0) s2.append(sv('rect',{x:labelW,y,width:uw,height:h,rx:3,fill:col}));
    const vl=sv('text',{x:W,y:y+h-3,'text-anchor':'end','font-size':11.5,fill:CSSVAR('--ink'),
      'font-family':'IBM Plex Mono, monospace','font-weight':500});
    vl.textContent = d.urgent ? `${d.v}／${d.urgent}急` : String(d.v);
    s2.append(vl);
    const hit=sv('rect',{x:0,y:i*rowH,width:W,height:rowH,fill:'transparent'});
    hit.addEventListener('mouseenter',()=>{ bar.setAttribute('opacity','.6');
      tip.innerHTML=`<div class="t-d">${d.k}</div><div class="t-v">${d.v} 項 · ${d.urgent} 項需立即修補</div>`;
      tip.style.left=(labelW+w/2)+'px'; tip.style.top=(i*rowH)+'px'; tip.style.opacity=1;});
    hit.addEventListener('mouseleave',()=>{bar.setAttribute('opacity','.4'); tip.style.opacity=0;});
    s2.append(hit);
  });
  host.append(s2);
}

    s.append(hit);
  });
  host.append(s);
}

const NET_TAGS=/switch|firewall|router|core-network|access-layer|perimeter/;
function iconOf(a){
  const t=(a.tags||[]).join(' ');
  if(/cloud/.test(t)) return 'cloud';
  // router 要排在 firewall 前面：邊界路由器同時帶 perimeter 標籤，
  // 先比對 firewall 會讓它畫成防火牆。
  if(/\brouter\b/.test(t)) return 'router';
  if(/firewall/.test(t)) return 'firewall';
  if(/switch|core-network|access-layer/.test(t)) return 'switch';
  if(/vpn/.test(t)) return 'router';
  if(/file-share|backup/.test(t)) return 'storage';
  if(/workstation/.test(t)) return 'pc';
  return 'server';
}
const isNetDevice = a => NET_TAGS.test((a.tags||[]).join(' '));

/* ---- 分組 ---- */
const TOPO_MODES={
  vlan:    {label:'VLAN',     of:a=>a.vlan||'（未指定 VLAN）'},
  subnet:  {label:'網段',     of:a=>{const s2=subnetOf(a); return s2? s2.v+(s2.guessed?'（推定）':'') : '（無 IP）';}},
  location:{label:'放置地點', of:a=>a.location||'（未指定地點）'},
  prefix:  {label:'主機名稱', of:a=>{const m=/^([A-Za-z]+-[A-Za-z]+)/.exec(a.hostname); return m?m[1]+'-*':a.hostname;}},
};

/* ---- 受害判定與攻擊流向：全部由案件系統的「惡意行為」案件推導 ---- */
function maliciousCases(){ return CASES.filter(c=>c.verdict==='惡意行為'); }
function assetByHost(h){ return ASSETS.find(a=>a.hostname.toLowerCase()===String(h||'').toLowerCase()); }
function assetByIp(ip){
  if(!ip||ip==='—') return null;
  return ASSETS.find(a=>a.ip===ip) || ASSETS.find(a=>a.ipv6===ip) || null;
}
/* 私有位址若比對不到資產，代表清冊還沒收錄，不該當成「外部位址」畫在圖上——
   否則 RFC1918 的內網 IP 會被誤標為境外攻擊來源。 */
const isPrivateIp = ip => /^(10\.|127\.|169\.254\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(String(ip||''));
function topoModel(){
  const compromised=new Map();   // assetId -> [case,…]
  const iocHits=new Map();       // assetId -> [ioc,…]
  const flows=[];                // {fromId|ext, toId|ext, label, caseId, sev}
  const externals=new Map();     // ip -> {ip, cases:[]}

  const touch=(a,c)=>{ if(!a)return; const k=a.id;
    if(!compromised.has(k)) compromised.set(k,[]);
    if(!compromised.get(k).some(x=>x.id===c.id)) compromised.get(k).push(c); };

  maliciousCases().forEach(c=>{
    touch(assetByHost(c.host), c);
    (c.conns||[]).forEach((n,i)=>{
      const A=assetByIp(n.src), B=assetByIp(n.dst);
      touch(A,c); touch(B,c);
      const key=x=>x?('a:'+x.id):null;
      const extKey=ip=>{ if(!ip||ip==='—'||isPrivateIp(ip))return null;
        if(!externals.has(ip)) externals.set(ip,{ip, cases:[]});
        if(!externals.get(ip).cases.some(x=>x.id===c.id)) externals.get(ip).cases.push(c);
        return 'e:'+ip; };
      const from=key(A)||extKey(n.src), to=key(B)||extKey(n.dst);
      if(from&&to&&from!==to)
        flows.push({from, to, label:c.cat, caseId:c.id, sev:c.sev, note:n.note||'',
                    t:new Date(String(c.occur[0]).replace(' ','T')).getTime(), seqIn:i});
    });
    // IOC 中的內部 IP 也算命中
    (DETAIL[c.id]?.iocs||[]).forEach(o=>{
      if(o.t!=='ip') return;
      const a=assetByIp(o.v);
      if(a){ touch(a,c);
        if(!iocHits.has(a.id)) iocHits.set(a.id,[]);
        iocHits.get(a.id).push(o); }
    });
  });
  // 依案發時間排出攻擊順序，同一對端點＋同一事件類別只留一條
  flows.sort((a,b)=>(a.t-b.t)||(a.seqIn-b.seqIn));
  const seen=new Set(), uniq=[];
  flows.forEach(f=>{ const k=f.from+'>'+f.to+'|'+f.label;
    if(!seen.has(k)){ seen.add(k); uniq.push(f); } });
  return {compromised, iocHits, flows:uniq, externals};
}

/* ---- 版面：以 uplink 建樹，端點主機依所選模式收進方框 ---- */
const TOPO_GEO={iconW:74, iconH:64, cols:5, boxPadX:14, boxPadY:34, boxGapX:34, boxGapY:30,
                nodeW:104, nodeH:96, layerGap:132};

const CIRCLED='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const seqMark = n => n<=20 ? CIRCLED[n-1] : '('+n+')';
const CHAN_GAP=15;   // 通道間距

function topoLayout(mode){
  const M=topoModel();
  const mm=TOPO_MODES[mode]||TOPO_MODES.vlan;
  const nets=ASSETS.filter(isNetDevice);
  const ends=ASSETS.filter(a=>!isNetDevice(a));
  const byHost=Object.fromEntries(nets.map(n=>[n.hostname,n]));

  // 深度：沿 uplink 往上找，找不到就掛 Internet
  const depth=new Map();
  const parentOf=n=>{ const u=(n.uplink||'').trim(); return byHost[u]&&byHost[u]!==n ? byHost[u] : null; };
  nets.forEach(n=>{ let d=1,cur=n,guard=0;
    while(parentOf(cur)&&guard++<10){ cur=parentOf(cur); d++; }
    depth.set(n.hostname,d); });

  // 群組：依模式分，並歸到成員最常用的 uplink 設備
  const groups=new Map();
  ends.forEach(a=>{
    const k=mm.of(a);
    if(!groups.has(k)) groups.set(k,{key:k, items:[], parent:null});
    groups.get(k).items.push(a);
  });
  groups.forEach(g=>{
    const tally={};
    g.items.forEach(a=>{ const u=(a.uplink||'').trim(); if(byHost[u]) tally[u]=(tally[u]||0)+1; });
    const best=Object.entries(tally).sort((x,y)=>y[1]-x[1])[0];
    g.parent=best?best[0]:null;
  });

  // 逐層排版
  const layers=new Map();
  layers.set(0,[{kind:'internet', key:'internet', label:'Internet'}]);
  nets.forEach(n=>{ const d=depth.get(n.hostname);
    if(!layers.has(d)) layers.set(d,[]);
    layers.get(d).push({kind:'net', key:'a:'+n.id, asset:n}); });
  const maxNetDepth=Math.max(1,...[...depth.values()]);
  const groupLayer=maxNetDepth+1;
  // 通道帶：每條流向一條水平走線，帶高依流向數決定，方框因此往下挪
  const chanCount=M.flows.length;
  const bandH=chanCount ? 34+chanCount*CHAN_GAP : 0;
  layers.set(groupLayer, [...groups.values()].map(g=>({kind:'group', key:'g:'+g.key, group:g})));

  const nodes=new Map(); let maxW=0;
  [...layers.keys()].sort((a,b)=>a-b).forEach(d=>{
    const row=layers.get(d);
    // 群組層改為自動換行，避免橫向無限延伸
    const widths=row.map(it=> it.kind==='group'
      ? Math.min(TOPO_GEO.cols, it.group.items.length)*TOPO_GEO.iconW + TOPO_GEO.boxPadX*2
      : TOPO_GEO.nodeW);
    const total=widths.reduce((a,b)=>a+b,0)+TOPO_GEO.boxGapX*(row.length-1);
    let x=-total/2;
    row.forEach((it,i)=>{
      const w=widths[i];
      const rows=it.kind==='group' ? Math.ceil(it.group.items.length/TOPO_GEO.cols) : 1;
      const h=it.kind==='group' ? rows*TOPO_GEO.iconH + TOPO_GEO.boxPadY + 12 : TOPO_GEO.nodeH;
      const yy = d*TOPO_GEO.layerGap + (d===groupLayer ? bandH : 0);
      nodes.set(it.key, {...it, x, y:yy, w, h});
      x+=w+TOPO_GEO.boxGapX;
    });
    maxW=Math.max(maxW,total);
  });

  // 連線
  const links=[];
  nets.forEach(n=>{
    const p=parentOf(n);
    links.push({from:p?('a:'+p.id):'internet', to:'a:'+n.id, ip:n.ip||n.ipv6||''});
  });
  groups.forEach(g=>{
    const p=g.parent?byHost[g.parent]:null;
    links.push({from:p?('a:'+p.id):'internet', to:'g:'+g.key, ip:''});
  });
  const bandTop = maxNetDepth*TOPO_GEO.layerGap + 78;
  return {nodes, links, model:M, groups, mode:mm, bandTop, bandH, groupLayer};
}

function nodeState(L,key){
  if(key.startsWith('e:')) return 'ext';
  if(key.startsWith('a:')){
    const id=key.slice(2);
    return L.model.compromised.has(id) ? 'bad' : 'ok';
  }
  return 'ok';
}

function drawTopo(L){
  const stage=$('#topo-stage'); if(!stage)return;
  stage.innerHTML='';
  const W=stage.clientWidth||900, H=stage.clientHeight||560;
  const svg=sv('svg',{width:W, height:H, viewBox:`0 0 ${W} ${H}`, class:'topo-svg', role:'img',
    'aria-label':`網路拓撲圖（依${L.mode.label}分組）`});

  const defs=sv('defs');
  ['flow','flow-dim'].forEach(id=>{
    const mk=sv('marker',{id:'arw-'+id, viewBox:'0 0 10 10', refX:'9', refY:'5',
      markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse'});
    const pth=sv('path',{d:'M0 0 L10 5 L0 10 z', fill:CSSVAR('--critical'),
      opacity: id==='flow'?'1':'.45'});
    mk.append(pth); defs.append(mk);
  });
  svg.append(defs);

  // data-pan：匯出 PNG 時清掉畫面上的平移縮放，輸出完整的圖
  const g=sv('g',{id:'topo-g','data-pan':'1'});
  svg.append(g);

  const flowLabels=[]; let labelSeq=0;
  const only=S.tOnlyHit;
  const visible=k=>{
    if(!only) return true;
    const n=L.nodes.get(k); if(!n) return false;
    if(n.kind==='group') return n.group.items.some(a=>L.model.compromised.has(a.id));
    if(n.kind==='ext') return true;
    if(n.kind==='net') return L.model.compromised.has(n.asset.id) ||
      L.links.some(l=>(l.from===k||l.to===k) && visible2(l.from===k?l.to:l.from));
    return true;
  };
  const visible2=k=>{ const n=L.nodes.get(k); if(!n)return false;
    if(n.kind==='group') return n.group.items.some(a=>L.model.compromised.has(a.id));
    if(n.kind==='net') return L.model.compromised.has(n.asset.id);
    return n.kind==='ext'; };

  // 連線（先畫，壓在節點下）
  const lg=sv('g',{class:'topo-links'});
  L.links.forEach(l=>{
    const A=L.nodes.get(l.from), B=L.nodes.get(l.to);
    if(!A||!B||!visible(l.from)||!visible(l.to))return;
    const ax=A.x+A.w/2, ay=A.y+A.h, bx=B.x+B.w/2, by=B.y;
    const my=(ay+by)/2;
    lg.append(sv('path',{d:`M${ax},${ay} C${ax},${my} ${bx},${my} ${bx},${by}`,
      fill:'none', stroke:CSSVAR('--rule-2'), 'stroke-width':1.4}));
    if(l.ip){
      const t=sv('text',{x:bx+7, y:by-9, 'font-size':9.5, fill:CSSVAR('--ink-3'),
        'font-family':'IBM Plex Mono, monospace'});
      t.textContent=l.ip; lg.append(t);
    }
  });
  g.append(lg);

  // 攻擊流向：全部走「通道」——先離開方框邊緣，橫向走自己的一條專屬水平線，
  // 再垂直落到目標邊緣。每條流向一條通道，所以線不壓方框、標籤也不會互相重疊。
  if(S.tFlows){
    const fg=sv('g',{class:'topo-flows'});
    const list=drawableFlows(L);
    const band=L.bandTop||0;
    const R=9;   // 轉角圓角
    list.forEach(({f,rf,rt,leg,seq},idx)=>{
      if(!visible(rf.key)||!visible(rt.key))return;
      const col=CSSVAR('--critical');
      const ay = rf.isGroup ? rf.top : rf.bottom;
      const by = rt.isGroup ? rt.top : rt.bottom;
      const ax = rf.cx, bx = rt.cx;
      let d, lx, ly;

      if(!rf.isGroup && !rt.isGroup){
        // 上半部（外部位址↔Internet）距離短，直接連並稍微彎一下
        const my=Math.min(ay,by)-26-idx*6;
        d=`M${ax},${ay} C${ax},${my} ${bx},${my} ${bx},${by}`;
        lx=(ax+bx)/2; ly=my-6;
      }else{
        const chy = band + 22 + idx*CHAN_GAP;
        const s1 = ay<chy ? 1 : -1;      // 由上往下 or 由下往上進通道
        const s2 = by<chy ? 1 : -1;
        const dir = bx>=ax ? 1 : -1;
        d = `M${ax},${ay}`
          + ` L${ax},${chy-s1*R}`
          + ` Q${ax},${chy} ${ax+dir*R},${chy}`
          + ` L${bx-dir*R},${chy}`
          + ` Q${bx},${chy} ${bx},${chy+s2*R}`
          + ` L${bx},${by}`;
        lx=(ax+bx)/2; ly=chy;
      }

      fg.append(sv('path',{d, fill:'none', stroke:col, 'stroke-width':2.2,
        'stroke-linecap':'round', 'stroke-linejoin':'round',
        'marker-end':'url(#arw-flow)', opacity:'.92'}));
      fg.append(sv('path',{d, fill:'none', stroke:CSSVAR('--surface'), 'stroke-width':2.2,
        'stroke-linecap':'round', 'stroke-linejoin':'round',
        'stroke-dasharray':'7 13', class:'flow-dash', opacity:'.85'}));

      // 水平段中央再補一個箭頭，內網流向也一眼看得出方向
      if(rf.isGroup || rt.isGroup){
        const chy = band + 22 + idx*CHAN_GAP;
        const ang = bx>=ax ? 0 : 180;
        fg.append(sv('path',{d:'M-7,-5 L6,0 L-7,5 Z', fill:col,
          transform:`translate(${(ax+bx)/2},${chy}) rotate(${ang})`, opacity:'.95'}));
      }
      if(leg!=='in2'&&leg!=='out2')
        flowLabels.push({x:lx, y:ly, label:f.label, leg,
                         seq:++labelSeq, onChannel:(rf.isGroup||rt.isGroup)});
    });
    g.append(fg);
  }

  // 節點
  L.nodes.forEach((n,key)=>{
    if(!visible(key))return;
    g.append(n.kind==='group' ? drawGroup(L,n,key)
           : n.kind==='ext'   ? drawExt(L,n,key)
           : n.kind==='net'   ? drawNet(L,n,key)
                              : drawInternet(n,key));
  });

  g.append(drawSensorLayer(L));

  // 攻擊流向的文字最後畫，確保永遠壓在最上層看得見
  if(flowLabels.length){
    const lgz=sv('g',{class:'topo-flow-labels'});
    flowLabels.forEach(({x,y,label,seq,onChannel})=>{
      const txt=seqMark(seq)+' '+label;
      const tw=txt.length*10+20;
      // 通道上的標籤往右挪開中央箭頭，避免壓住
      const cx = onChannel ? x+tw/2+16 : x;
      lgz.append(sv('rect',{x:cx-tw/2, y:y-10, width:tw, height:20, rx:10,
        fill:CSSVAR('--surface'), stroke:CSSVAR('--critical'), 'stroke-width':1.2}));
      const t=sv('text',{x:cx, y:y+4.5, 'text-anchor':'middle', 'font-size':10.5,
        fill:CSSVAR('--critical'), 'font-weight':'600'});
      t.textContent=txt; lgz.append(t);
    });
    g.append(lgz);
  }

  stage.append(svg);
  if(!TOPO || TOPO.mode!==S.tMode){ TOPO={mode:S.tMode, tx:0, ty:0, scale:1}; topoFit(true); }
  applyTopoTransform();
  bindTopoPanZoom(svg);
}

/* 外部位址節點先放好，讓計數與繪圖用的是同一份 nodes */
function placeExternals(L){
  [...L.model.externals.values()].forEach((e,i)=>{
    if(L.nodes.has('e:'+e.ip))return;
    L.nodes.set('e:'+e.ip, {kind:'ext', key:'e:'+e.ip, ip:e.ip, cases:e.cases,
      x:(i%2?1:-1)*(320+Math.floor(i/2)*170)-TOPO_GEO.nodeW/2,
      y:-TOPO_GEO.layerGap, w:TOPO_GEO.nodeW, h:TOPO_GEO.nodeH});
  });
}
/* 實際畫得出來的流向：兩端都解析得到、且不會落在同一個方框內。
   工具列的計數與圖上的箭頭因此永遠一致。 */
function drawableFlows(L){
  placeExternals(L);
  const seen=new Set(), out=[];
  let seq=0;
  const push=(f,rf,rt,leg,n)=>{
    if(!rf||!rt||rf.key===rt.key)return false;
    const k=rf.key+'>'+rt.key+'|'+f.label;
    if(seen.has(k))return false; seen.add(k);
    out.push({f,rf,rt,leg,seq:n});
    return true;
  };
  L.model.flows.forEach(f=>{
    const rf=resolveEndpoint(L,f.from), rt=resolveEndpoint(L,f.to);
    const net=resolveEndpoint(L,'internet');
    // 外部位址不直接連受害主機，先經 Internet 再落地，符合實際封包路徑
    const n=seq+1;
    let used=false;
    if(f.from.startsWith('e:') && net){
      used = push(f,rf,net,'in',n) | push(f,net,rt,'in2',n);
    } else if(f.to.startsWith('e:') && net){
      used = push(f,rf,net,'out',n) | push(f,net,rt,'out2',n);
    } else {
      used = push(f,rf,rt,'lan',n);
    }
    if(used) seq=n;
  });
  return out;
}

/* 錨點回傳節點的邊界，走線從邊緣出發，就不會壓在方框上 */
function resolveEndpoint(L,key){
  if(L.nodes.has(key)){ const n=L.nodes.get(key);
    return {key, cx:n.x+n.w/2, top:n.y, bottom:n.y+n.h, isGroup:n.kind==='group'}; }
  if(key.startsWith('a:')){
    const id=key.slice(2);
    for(const [k,n] of L.nodes){
      if(n.kind!=='group')continue;
      const i=n.group.items.findIndex(x=>x.id===id);
      if(i>=0){
        const col=i%TOPO_GEO.cols;
        return {key:k, cx:n.x+TOPO_GEO.boxPadX+col*TOPO_GEO.iconW+TOPO_GEO.iconW/2,
                top:n.y, bottom:n.y+n.h, isGroup:true, hostId:id};
      }
    }
  }
  return null;
}

function nodeShell(key, x, y, w, h, cls, onPick){
  const gg=sv('g',{class:'topo-node '+cls, transform:`translate(${x},${y})`,
    tabindex:'0', role:'button'});
  gg.addEventListener('click', ev=>{ ev.stopPropagation(); onPick(); });
  gg.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ev.preventDefault(); onPick();} });
  return gg;
}
function pickTarget(kind, key){ S.tPick={kind, key}; render(); }

/* ---- 感測器 ---- */
/* 閘道＝流量匯聚點，也就是感測器唯一有意義的佈署位置：
   路由器、防火牆、交換器。工作站上掛 TAP 沒有意義，所以不列入。 */
const GATEWAY_TAGS=/router|firewall|switch|core-network|access-layer|perimeter|vpn/;
const gateways = () => ASSETS.filter(a=>GATEWAY_TAGS.test((a.tags||[]).join(' ')))
  .sort((a,b)=>a.hostname.localeCompare(b.hostname));

/* 介面命名依設備型態，讓 port 看起來像真的設備介面 */
function ifName(a,i){
  const t=(a.tags||[]).join(' ');
  if(/firewall|perimeter/.test(t) && /PAN-OS/i.test(a.os||'')) return `ethernet1/${i}`;
  if(/firewall|vpn/.test(t)) return `port${i}`;
  if(/router/.test(t)) return `Gi0/0/${i}`;
  return `Gi1/0/${i}`;
}
/* 閘道的 port 由拓撲關係推出：上行一個，其餘每個下掛裝置各一個。
   不隨分組模式改變，所以感測器的佈署位置是穩定的。 */
function portsOf(a){
  const list=[];
  const up=(a.uplink||'').trim();
  const upAsset=ASSETS.find(x=>x.hostname===up);
  list.push({id:'uplink',
    name: /對外|無上層|雲端/.test(up) ? (/firewall|router/.test((a.tags||[]).join(' '))?'WAN':'Uplink') : ifName(a,1),
    to: upAsset?upAsset.hostname : (up||'（對外）'), role:'上行'});
  ASSETS.filter(x=>x.hostname!==a.hostname && (x.uplink||'').trim()===a.hostname)
    .sort((x,y)=>x.hostname.localeCompare(y.hostname))
    .forEach((x,i)=>list.push({id:'a:'+x.id, name:ifName(a,i+2), to:x.hostname,
      role:isNetDevice(x)?'下接設備':'下接主機'}));
  return list;
}
const sensorOnPort = (key,portId) => SENSORS.find(x=>x.kind==='asset'&&x.key===key&&x.port===portId);

function sensorPanel(){
  const gws=gateways();
  return el('div',{class:'card sensor-panel'},
    el('div',{class:'sp-head'},
      el('span',{class:'sensor-mark'},'✳'),
      el('div',{style:'flex:1'},
        el('div',{style:'font-size:13px;font-weight:600'},'感測器佈署'),
        el('div',{style:'font-size:11.5px;color:var(--ink-3);margin-top:2px'},
          '勾選要佈署的閘道設備。感測器只掛在流量匯聚點（路由器、防火牆、交換器），編號 S1、S2… 自動連號。')),
      el('button',{class:'btn btn-sm', onclick:()=>{S.tSensorMode=false; render();}},'完成')),
    el('div',{class:'sp-list'}, ...gws.map(a=>{
      const key='a:'+a.id, ports=portsOf(a), mine=sensorsAt('asset',key);
      const open=S.tSensorOpen===key;
      return el('div',{class:'sp-dev'+(mine.length?' on':'')},
        el('button',{class:'sp-dev-head','aria-expanded':String(open),
          onclick:()=>{S.tSensorOpen=open?null:key; render();}},
          el('span',{class:'sp-caret'}, open?'▾':'▸'),
          el('span',{class:'sp-ico', html:`<svg viewBox="0 0 40 40" width="20" height="20" color="${mine.length?'var(--critical)':'var(--ink-3)'}">${TOPO_ICON[iconOf(a)]}</svg>`}),
          el('span',{class:'sp-txt'},
            el('span',{class:'mono'},a.hostname),
            el('small',{},`${a.ip||a.ipv6||'—'} · ${ports.length} 個 port`)),
          ...mine.map(x=>el('span',{class:'sp-tag'},x.label))),
        open ? el('div',{class:'sp-ports'}, ...ports.map(pt=>{
          const sn=sensorOnPort(key,pt.id);
          return el('button',{class:'sp-port'+(sn?' on':''),'aria-pressed':String(!!sn),
            onclick:()=>toggleSensor('asset',key,pt)},
            el('span',{class:'sp-box'}, sn?el('span',{class:'sp-star'},'✳'):null),
            el('span',{class:'sp-if mono'},pt.name),
            el('span',{class:'sp-role'},pt.role),
            el('span',{class:'sp-to mono'},'→ '+pt.to),
            sn?el('span',{class:'sp-tag'},sn.label):null);
        })) : null);
    })),
    el('div',{class:'sp-foot'},
      el('span',{style:'flex:1;font-size:11.5px;color:var(--ink-3)'},
        `已佈署 ${SENSORS.length} 個感測器` + (SENSORS.length?`：${SENSORS.map(x=>x.label).join('、')}`:'')),
      SENSORS.length ? el('button',{class:'btn btn-sm btn-danger',
        onclick:()=>{SENSORS.length=0; persist(); render(); toast('已移除全部感測器');}},'全部移除') : null));
}

function sensorsAt(kind,key){ return SENSORS.filter(x=>x.kind===kind&&x.key===key); }
/* 連線上的取點：連線是三次貝茲，t 越接近 1 越靠近子節點 */
function linkPointAt(L, fromKey, toKey, t){
  const A=L.nodes.get(fromKey), B=L.nodes.get(toKey);
  if(!A||!B)return null;
  const ax=A.x+A.w/2, ay=A.y+A.h, bx=B.x+B.w/2, by=B.y, my=(ay+by)/2;
  const u=1-t;
  const x=u*u*u*ax + 3*u*u*t*ax + 3*u*t*t*bx + t*t*t*bx;
  const y=u*u*u*ay + 3*u*u*t*my + 3*u*t*t*my + t*t*t*by;
  return {x,y};
}
/* 感測器掛在哪條線上：上行 → 父節點來的那條；下接 → 往該子節點的那條。
   兩者因此自然分開在節點上下方，位置也對得上實際 port。 */
function sensorAnchor(L, sn){
  const a=ASSETS.find(x=>'a:'+x.id===sn.key); if(!a)return null;
  const selfKey='a:'+a.id;
  const n=L.nodes.get(selfKey); if(!n)return null;

  if(sn.port==='uplink'){
    const lk=L.links.find(l=>l.to===selfKey);
    if(lk){ const pt=linkPointAt(L, lk.from, selfKey, 0.72); if(pt) return pt; }
    return {x:n.x+n.w/2, y:n.y-18};
  }

  const child=ASSETS.find(x=>'a:'+x.id===sn.port);
  if(child){
    // 只認真的有畫出來的線；否則會在兩個不相連的節點之間插一個點，
    // 那條想像中的線可能正好穿過別的節點。
    const cand=['a:'+child.id];
    for(const [k,g] of L.nodes){
      if(g.kind==='group' && g.group.items.some(x=>x.id===child.id)){ cand.push(k); break; }
    }
    for(const target of cand){
      if(L.links.some(l=>l.from===selfKey && l.to===target)){
        const pt=linkPointAt(L, selfKey, target, 0.28);
        if(pt) return pt;
      }
    }
  }
  // 端點主機沒有自己的線（收在方框裡），就掛在設備下緣，依 port 序左右錯開
  const ports=portsOf(a);
  const i=Math.max(0, ports.findIndex(x=>x.id===sn.port));
  const down=ports.length-1 || 1;
  const spread=Math.min(n.w+34, 26*down);
  return {x:n.x+n.w/2 - spread/2 + (spread/Math.max(1,down-1||1))*(i-1), y:n.y+n.h+20, loose:true};
}
function drawSensorLayer(L){
  const g2=sv('g',{class:'topo-sensors'});
  const used=[];
  SENSORS.forEach(sn=>{
    const pt=sensorAnchor(L, sn); if(!pt)return;
    // 同一條線上有多個感測器就沿線錯開，不要疊在一起
    let {x,y}=pt, guard=0;
    while(used.some(u=>Math.hypot(u.x-x,u.y-y)<30) && guard++<8){
      if(pt.loose) x+=30; else y+=26;
    }
    used.push({x,y});
    g2.append(sensorBadge(x, y, sn));
  });
  return g2;
}
function sensorBadge(cx, cy, sn){
  const g2=sv('g',{class:'sensor-badge'});
  const up = sn.port==='uplink';
  g2.append(sv('circle',{cx, cy, r:15, fill:CSSVAR('--critical'), opacity:'.16'}));
  g2.append(sv('circle',{cx, cy, r:10.5, fill:CSSVAR('--critical'),
    stroke:CSSVAR('--surface'), 'stroke-width':2}));
  const t=sv('text',{x:cx, y:cy+4.6,'text-anchor':'middle','font-size':13,
    fill:'#fff','font-weight':'700'});
  t.textContent='✳'; g2.append(t);
  // 上行標在星號上方、下接標在下方，一眼分得出方向
  const ly = up ? cy-16 : cy+21;
  const lb=sv('text',{x:cx, y:ly,'text-anchor':'middle','font-size':9,
    fill:CSSVAR('--critical'),'font-family':'IBM Plex Mono, monospace','font-weight':'700'});
  lb.textContent=sn.label+(up?' ↑':' ↓'); g2.append(lb);
  if(sn.portName){
    const pn=sv('text',{x:cx, y:up?ly-9:ly+9,'text-anchor':'middle','font-size':7.8,
      fill:CSSVAR('--ink-3'),'font-family':'IBM Plex Mono, monospace'});
    pn.textContent=sn.portName; g2.append(pn);
  }
  const ttl=sv('title');
  ttl.textContent=`感測器 ${sn.label} · ${up?'上行':'下接'} ${sn.portName||''}`
    +(sn.portTo?` → ${sn.portTo}`:'');
  g2.append(ttl);
  return g2;
}
function toggleSensor(kind,key,port){
  const pid=port?port.id:'uplink';
  const ex=SENSORS.find(x=>x.kind===kind&&x.key===key&&x.port===pid);
  if(ex){ SENSORS.splice(SENSORS.indexOf(ex),1); toast(`已移除感測器 ${ex.label}`); }
  else{
    const host=(ASSETS.find(a=>'a:'+a.id===key)||{}).hostname||'';
    const pt=port||(portsOf(ASSETS.find(a=>'a:'+a.id===key)||{})[0]||{name:'Uplink',to:'—',role:'上行'});
    SENSORS.push({kind, key, port:pid, portName:pt.name, portTo:pt.to, portRole:pt.role,
                  label:'S'+(SENSORS.length+1), at:nowStamp(), by:S.me});
    toast(`已於 ${host} 的 ${pt.name} 佈署感測器`);
  }
  SENSORS.forEach((x,i)=>x.label='S'+(i+1));
  persist(); render();
}

/* ---- 平移縮放 ---- */
function applyTopoTransform(){
  const g=$('#topo-g'); if(!g||!TOPO)return;
  g.setAttribute('transform',`translate(${TOPO.tx},${TOPO.ty}) scale(${TOPO.scale})`);
}
function topoZoom(dir){
  if(!TOPO)return;
  TOPO.scale=Math.max(0.25, Math.min(2.5, TOPO.scale*(dir>0?1.2:1/1.2)));
  applyTopoTransform();
}
function topoFit(silent){
  const stage=$('#topo-stage'), g=$('#topo-g'); if(!stage||!g||!TOPO)return;
  g.setAttribute('transform','translate(0,0) scale(1)');
  const b=g.getBBox();
  if(!b.width||!b.height)return;
  const pad=28, W=stage.clientWidth, H=stage.clientHeight;
  const sc=Math.min((W-pad*2)/b.width, (H-pad*2)/b.height, 1.6);
  TOPO.scale=sc;
  TOPO.tx=(W-b.width*sc)/2 - b.x*sc;
  TOPO.ty=(H-b.height*sc)/2 - b.y*sc;
  applyTopoTransform();
  if(!silent) toast('已重新符合視窗');
}
function bindTopoPanZoom(svg){
  let on=false,x0=0,y0=0,tx0=0,ty0=0;
  svg.addEventListener('pointerdown',e=>{
    if(e.target.closest('.topo-node')||e.target.closest('.topo-host'))return;
    on=true; x0=e.clientX; y0=e.clientY; tx0=TOPO.tx; ty0=TOPO.ty;
    svg.setPointerCapture(e.pointerId); svg.classList.add('grabbing');
  });
  svg.addEventListener('pointermove',e=>{
    if(!on)return; TOPO.tx=tx0+(e.clientX-x0); TOPO.ty=ty0+(e.clientY-y0); applyTopoTransform();
  });
  const end=e=>{ on=false; svg.classList.remove('grabbing');
    try{svg.releasePointerCapture(e.pointerId);}catch(_){} };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=svg.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const k=e.deltaY<0?1.12:1/1.12;
    const ns=Math.max(0.25, Math.min(2.5, TOPO.scale*k));
    TOPO.tx=mx-(mx-TOPO.tx)*(ns/TOPO.scale);
    TOPO.ty=my-(my-TOPO.ty)*(ns/TOPO.scale);
    TOPO.scale=ns; applyTopoTransform();
  },{passive:false});
  svg.addEventListener('click',()=>{ if(S.tPick){S.tPick=null; render();} });
}

/* 跨系統跳轉一律走這裡：先存下目前位置，到站後畫面頂端就會有返回列。 */

function navSnapshot(){ const o={}; NAV_KEYS.forEach(k=>o[k]=S[k]); return o; }
function crossGo(target){
  const from=navSnapshot();
  S.backTo = (target.app && target.app!==S.app) ? from : S.backTo;
  Object.assign(S, target);
  S.tSensorMode=false; S.mPanel=null; S.iform=null;
  if(target.app && target.app!==from.app) TOPO=null;
  saveSession(); render(); window.scrollTo(0,0);
}

  const b=S.backTo; if(!b)return;
  S.backTo=null; Object.assign(S, b);
  saveSession(); render(); window.scrollTo(0,0);
}

/* ---- 受檢環境風險評估 ----
   兩個權重：受害主機「數量比例」與「重要程度」。
   單純比例會被大量健康工作站稀釋，所以重要性佔比較高，
   並替「關鍵資產受害」設一個地板值——一台網域控制站淪陷，
   不該因為另外兩百台工作站沒事就被算成低風險。 */
const IMP_WEIGHT={'關鍵':1.0,'高':0.7,'中':0.4,'低':0.2};
const RISK_FLOOR_CRITICAL=45;
function riskAssessment(){
  const total=ASSETS.length||1;
  const M=topoModel();
  const hit=ASSETS.filter(a=>M.compromised.has(a.id));
  const ratio=hit.length/total;
  const wAll=ASSETS.reduce((n,a)=>n+(IMP_WEIGHT[a.importance]||0.2),0)||1;
  const wHit=hit.reduce((n,a)=>n+(IMP_WEIGHT[a.importance]||0.2),0);
  const impShare=wHit/wAll;
  let score=100*(0.4*ratio + 0.6*impShare);
  const critHit=hit.filter(a=>a.importance==='關鍵');
  const floored=critHit.length>0 && score<RISK_FLOOR_CRITICAL;
  if(floored) score=RISK_FLOOR_CRITICAL;
  score=Math.min(100, Math.round(score*10)/10);
  const level = score>=70?'嚴重' : score>=45?'高' : score>=20?'中' : '低';
  return {score, level, total, hit:hit.length, ratio, impShare, wHit, wAll,
          critHit:critHit.length, floored, hitAssets:hit};
}
const RISK_COLOR={'嚴重':'var(--critical)','高':'var(--serious)','中':'var(--warning)','低':'var(--good)'};

/* ---- TTP 熱圖圖層 ----
   一格可能同時被分析員與多個 APT 標到。用分層條紋而非混色：
   顏色不互相污染，三方以上仍分得出是誰。 */
function ttpLayers(){
  const marks=analystTtps();
  const map=new Map();   // techId -> [{kind,label,color,detail}]
  const add=(tid,layer)=>{ if(!map.has(tid)) map.set(tid,[]); map.get(tid).push(layer); };
  marks.forEach((v,tid)=>add(tid,{kind:'analyst', label:'分析員標註', color:ANALYST_COLOR,
    detail: v.cases.length ? `由 ${v.cases.length} 件案件帶入：${v.cases.join('、')}`
                           : (v.note||'分析員手動標註')}));
  APTS.forEach(a=>a.ttps.forEach(tid=>add(tid,{kind:'apt', id:a.id, label:a.name,
    color:LAYER_COLORS[a.colorIdx%LAYER_COLORS.length], detail:`${a.type} · ${a.country}`})));
  return map;
}
/* 熱圖列：母技術一列；展開時其可見子技術各一列 */
function heatRows(t){
  const out=[];
  t.techs.forEach(p=>{
    if(!techVisible(t.id,p.id))return;
    const subs=p.subs.filter(sb=>techVisible(t.id,sb.id));
    const open=S.mExpand.includes(t.id+'|'+p.id);
    out.push({kind:'parent', tech:p, subs, open, tacticId:t.id});
    if(open) subs.forEach(sb=>out.push({kind:'sub', tech:sb, parent:p, tacticId:t.id}));
  });
  return out;
}
/* 母技術收合時的圖層＝自身＋所有子技術的聯集，才看得出這一支有沒有被標到 */
function rowLayers(row, layers){
  if(row.kind==='sub') return layers.get(row.tech.id)||[];
  const seen=new Set(), out=[];
  const push=L=>{ const k=L.kind+':'+(L.id||'analyst');
    if(!seen.has(k)){ seen.add(k); out.push(L); } };
  (layers.get(row.tech.id)||[]).forEach(push);
  row.tech.subs.forEach(sb=>(layers.get(sb.id)||[]).forEach(push));
  return out;
}
const visibleTechs = t => heatRows(t);

const ICFG={
  apt:{title:'APT 組織綱目', cols:[['name','組織'],['type','類型'],['country','所在國家'],
        ['targets','攻擊目標'],['ttps','TTP'],['overlap','與本環境重疊']],
       groups:[['iaType',['全部','國家支持組織','網路犯罪集團','駭客激進份子','內部威脅','未知']],
               ['iaOv',['全部','有重疊','無重疊']]]},
  intel:{title:'情資報告綱目', cols:[['id','報告 ID'],['kind','情資類型'],['source','情資來源'],
        ['created','建立時間'],['iocs','IOC'],['ttps','TTP'],['overlap','與本環境重疊']],
       groups:[['inKind',['全部',...INTEL_KINDS]],
               ['inOv',['全部','有重疊','無重疊']],['inIoc',['全部','含 IOC','無 IOC']]],
       ttpFilter:true},
  hunt:{title:'威脅獵補計畫綱目', cols:[['id','計畫 ID'],['ttps','TTP ID'],['hypothesis','Hypothesis'],
        ['results','調查結果'],['created','建立時間'],['status','狀態']],
       groups:[['ihStatus',['全部','未開始','進行中','已完成']],['ihRes',['全部','已命中','未命中']]],
       ttpFilter:true},
};
function huntResults(h){ return h.results || (h.cases||[]).map(c=>({caseId:c, note:''})); }
function intelRows(kind){
  const q=S.iq.trim().toLowerCase();
  const mine=analystTtps();
  let rows;
  if(kind==='apt'){
    rows=APTS.filter(a=>{
      const ov=a.ttps.filter(t=>mine.has(t)).length;
      if(S.iaType!=='全部'&&a.type!==S.iaType)return false;
      if(S.iaOv==='有重疊'&&!ov)return false;
      if(S.iaOv==='無重疊'&&ov)return false;
      return !q||[a.id,a.name,a.type,a.country,a.desc,...a.targets,...a.ttps].join(' ').toLowerCase().includes(q);
    });
  } else if(kind==='intel'){
    rows=INTELS.filter(x=>{
      const ov=x.ttps.filter(t=>mine.has(t)).length;
      if(S.inOv==='有重疊'&&!ov)return false;
      if(S.inOv==='無重疊'&&ov)return false;
      if(S.inKind!=='全部'&&x.kind!==S.inKind)return false;
      if(S.inIoc==='含 IOC'&&!x.iocs.length)return false;
      if(S.inIoc==='無 IOC'&&x.iocs.length)return false;
      if(S.iTtp.intel.length && !S.iTtp.intel.some(t=>x.ttps.includes(t))) return false;
      return !q||[x.id,x.kind,x.source,x.content,x.analysis,...x.ttps,
        ...x.iocs.map(o=>o.v)].join(' ').toLowerCase().includes(q);
    });
  } else {
    rows=HUNTS.filter(h=>{
      const rs=huntResults(h);
      if(S.ihStatus!=='全部'&&h.status!==S.ihStatus)return false;
      if(S.ihRes==='已命中'&&!rs.length)return false;
      if(S.ihRes==='未命中'&&rs.length)return false;
      if(S.iTtp.hunt.length && !S.iTtp.hunt.some(t=>h.ttps.includes(t))) return false;
      return !q||[h.id,h.hypothesis,h.analytics,h.dataReq,h.filter,h.gaps,h.implement,
        ...h.ttps,...rs.map(r=>r.caseId)].join(' ').toLowerCase().includes(q);
    });
  }
  const key=S.iSort[kind].by, dir=S.iSort[kind].dir==='desc'?-1:1;
  const coll=new Intl.Collator('zh-Hant',{numeric:true});
  const ST={'未開始':0,'進行中':1,'已完成':2};
  const val=r=>({ name:r.name, id:r.id, type:r.type, country:r.country, kind:r.kind,
    targets:(r.targets||[]).length, ttps:(r.ttps||[]).length, created:r.created,
    source:r.source, iocs:(r.iocs||[]).length, hypothesis:r.hypothesis,
    results:huntResults(r).length, status:ST[r.status]??9,
    overlap:(r.ttps||[]).filter(t=>mine.has(t)).length })[key];
  rows=rows.slice().sort((a,b)=>{
    const av=val(a), bv=val(b);
    const c=(typeof av==='number')?av-bv:coll.compare(String(av||''),String(bv||''));
    return c*dir || coll.compare(a.id,b.id);
  });
  return rows;
}

/* 風險量表：一段弧顯示分數落點，四級刻度用各自的狀態色 */
function drawRiskDial(R){
  const host=$('#risk-dial'); if(!host)return;
  host.innerHTML='';
  const S2=104, cx=S2/2, cy=S2/2, r=40, W=11;
  const svg=sv('svg',{width:S2, height:S2, viewBox:`0 0 ${S2} ${S2}`, role:'img',
    'aria-label':`風險分數 ${R.score} 分，等級 ${R.level}`});
  const a0=135, a1=405;   // 270 度弧
  const pol=(ang,rr)=>{const t=(ang-90)*Math.PI/180; return [cx+rr*Math.cos(t), cy+rr*Math.sin(t)];};
  const arc=(from,to,col,w,op)=>{
    const [x1,y1]=pol(from,r), [x2,y2]=pol(to,r);
    const large=(to-from)>180?1:0;
    return sv('path',{d:`M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}`,
      fill:'none', stroke:col, 'stroke-width':w, 'stroke-linecap':'round', opacity:op||1});
  };
  svg.append(arc(a0,a1,CSSVAR('--surface-3'),W));
  [['低',0,20],['中',20,45],['高',45,70],['嚴重',70,100]].forEach(([lv,lo,hi])=>{
    svg.append(arc(a0+(a1-a0)*lo/100, a0+(a1-a0)*hi/100, RISK_COLOR[lv].startsWith('var')
      ? CSSVAR(RISK_COLOR[lv].slice(4,-1)) : RISK_COLOR[lv], W, .22));
  });
  const end=a0+(a1-a0)*Math.min(100,R.score)/100;
  const col=CSSVAR(RISK_COLOR[R.level].slice(4,-1));
  if(R.score>0.5) svg.append(arc(a0, end, col, W));
  const [hx,hy]=pol(end,r);
  svg.append(sv('circle',{cx:hx, cy:hy, r:6, fill:col, stroke:CSSVAR('--surface'),'stroke-width':2.4}));
  const t=sv('text',{x:cx, y:cy+2,'text-anchor':'middle','font-size':21,'font-weight':'700',
    fill:col,'font-family':'IBM Plex Mono, monospace'});
  t.textContent=Math.round(R.score); svg.append(t);
  const t2=sv('text',{x:cx, y:cy+16,'text-anchor':'middle','font-size':9,fill:CSSVAR('--ink-3')});
  t2.textContent='RISK'; svg.append(t2);
  host.append(svg);
}

/* ---- TTP Mapping 熱圖 ----
   一格用垂直細條分層：分析員一條、每個命中的 APT 各一條。
   顏色不互相混合，三方以上仍分得出是誰。 */
const HEAT={cw:118, ch:30, gap:5, headH:44, labelW:0};

function heatCell(sv2, x, y, w, h, tech, layers, opts){
  const row=opts.row||{kind:'parent', subs:[]};
  const isSub=row.kind==='sub';
  const g2=sv('g',{class:'heat-cell'+(layers.length?' on':'')+(opts.dim?' dim':'')+(isSub?' sub':'')});
  const ix = isSub ? x+11 : x, iw = isSub ? w-11 : w;
  if(isSub) g2.append(sv('path',{d:`M${x+4},${y-2} L${x+4},${y+h/2} L${x+10},${y+h/2}`,
    fill:'none', stroke:CSSVAR('--rule-2'), 'stroke-width':1}));
  g2.append(sv('rect',{x:ix, y, width:iw, height:h, rx:4,
    fill:CSSVAR('--surface-2'), stroke:CSSVAR('--rule'), 'stroke-width':1}));
  if(layers.length){
    const n=layers.length, sw=Math.max(3, Math.min(9, (iw-8)/n));
    layers.forEach((L,i)=>{
      g2.append(sv('rect',{x:ix+4+i*sw, y:y+3, width:sw-1.2, height:h-6, rx:1.6,
        fill:layerHex(L.color)}));
    });
    if(n>1) g2.append(sv('rect',{x:ix, y, width:iw, height:h, rx:4, fill:'none',
      stroke:CSSVAR('--ink-2'), 'stroke-width':1.2, opacity:'.55'}));
  }
  if(!isSub && row.subs && row.subs.length){
    const bx=ix+iw-16, by=y+h-9;
    const tg=sv('g',{class:'heat-exp'});
    tg.append(sv('rect',{x:bx-9, y:by-9, width:24, height:13, rx:6.5,
      fill:CSSVAR('--surface-3'), stroke:CSSVAR('--rule-2'),'stroke-width':.8}));
    const et=sv('text',{x:bx+3, y:by+1,'text-anchor':'middle','font-size':7.6,
      fill:CSSVAR('--ink-2'),'font-family':'IBM Plex Mono, monospace'});
    et.textContent=(row.open?'▾':'▸')+row.subs.length; tg.append(et);
    tg.style.cursor='pointer';
    tg.addEventListener('click',ev=>{ ev.stopPropagation();
      const k=row.tacticId+'|'+row.tech.id, i=S.mExpand.indexOf(k);
      if(i>=0) S.mExpand.splice(i,1); else S.mExpand.push(k);
      render(); });
    g2.append(tg);
  }
  const tx=sv('text',{x:ix+iw-6, y:y+12.5,'text-anchor':'end','font-size':8.4,
    fill:CSSVAR('--ink-3'),'font-family':'IBM Plex Mono, monospace'});
  tx.textContent=tech.id; g2.append(tx);
  const nm=sv('text',{x:ix+iw-(!isSub&&row.subs&&row.subs.length?22:6), y:y+h-6,
    'text-anchor':'end','font-size':8.6,
    fill:layers.length?CSSVAR('--ink'):CSSVAR('--ink-3')});
  const cut=isSub?12:(row.subs&&row.subs.length?9:11);
  nm.textContent=tech.name.length>cut?tech.name.slice(0,cut-1)+'…':tech.name; g2.append(nm);
  const ttl=sv('title');
  ttl.textContent=`${tech.id} ${tech.name}`+(layers.length
    ? '\n'+layers.map(L=>'• '+L.label+' — '+L.detail).join('\n') : '\n（尚未標註）');
  g2.append(ttl);
  return g2;
}

function drawHeat(hostId, opts){
  const host=$('#'+hostId); if(!host)return;
  host.innerHTML='';
  const layers=ttpLayers();
  const cols=ATTACK_FULL.map(t=>({t, techs:visibleTechs(t)}));
  const maxRows=Math.max(1,...cols.map(c=>c.techs.length));
  const W=cols.length*(HEAT.cw+HEAT.gap)+HEAT.gap;
  const H=HEAT.headH+maxRows*(HEAT.ch+HEAT.gap)+HEAT.gap;
  const svg=sv('svg',{width:W, height:H, viewBox:`0 0 ${W} ${H}`, class:'heat-svg',
    role:'img','aria-label':'TTP Mapping 熱圖'});
  cols.forEach((c,ci)=>{
    const x=HEAT.gap+ci*(HEAT.cw+HEAT.gap);
    svg.append(sv('rect',{x, y:6, width:HEAT.cw, height:HEAT.headH-12, rx:5,
      fill:CSSVAR('--surface-3'), stroke:CSSVAR('--rule'),'stroke-width':1}));
    const t1=sv('text',{x:x+HEAT.cw/2, y:22,'text-anchor':'middle','font-size':10.5,
      fill:CSSVAR('--ink'),'font-weight':'600'});
    t1.textContent=c.t.name; svg.append(t1);
    const t2=sv('text',{x:x+HEAT.cw/2, y:33,'text-anchor':'middle','font-size':8.4,
      fill:CSSVAR('--ink-3'),'font-family':'IBM Plex Mono, monospace'});
    const nP=c.techs.filter(r=>r.kind==='parent').length;
    t2.textContent=`${c.t.id} · ${nP}`; svg.append(t2);
    c.techs.forEach((row,ri)=>{
      const y=HEAT.headH+ri*(HEAT.ch+HEAT.gap);
      const ls=rowLayers(row, layers);
      // 聚焦某個組織時，沒有該組織的格子淡出，方便單看一個 APT 的覆蓋範圍
      const dim = !!(opts&&opts.focus) && !ls.some(L=>L.id===opts.focus);
      const cell=heatCell(svg, x, y, HEAT.cw, HEAT.ch, row.tech, ls, {...(opts||{}), dim, row});
      if(opts&&opts.onPick){
        cell.style.cursor='pointer';
        cell.addEventListener('click',()=>opts.onPick(row.tech, c.t, row));
      }
      svg.append(cell);
    });
  });
  host.append(svg);
  return {W,H};
}

let HOMEV=null;
function drawHeatMini(){
  drawHeat('heat-mini',{onPick:(tech,tac,row)=>{S.mPick={tech,tac,row}; go('matrix');}});
  bindHomeZoom();
}
function applyHomeT(){
  const pan=$('#heat-mini'); if(!pan||!HOMEV)return;
  pan.style.transform=`translate(${HOMEV.tx}px,${HOMEV.ty}px) scale(${HOMEV.k})`;
}
function homeZoom(d){ if(!HOMEV)return;
  HOMEV.k=Math.max(0.25,Math.min(2.2,HOMEV.k*(d>0?1.18:1/1.18))); applyHomeT(); }
function homeFit(){
  const st=$('#heat-home'), pan=$('#heat-mini'); if(!st||!pan)return;
  const svg=pan.querySelector('svg'); if(!svg)return;
  const w=+svg.getAttribute('width'), h=+svg.getAttribute('height');
  HOMEV={k:Math.min((st.clientWidth-20)/w,(st.clientHeight-20)/h,1.2), tx:10, ty:10};
  applyHomeT();
}
function bindHomeZoom(){
  const st=$('#heat-home'); if(!st)return;
  if(!HOMEV) homeFit(); else applyHomeT();
  let on=false,x0=0,y0=0,tx0=0,ty0=0;
  st.onpointerdown=e=>{ if(e.target.closest('.heat-cell'))return;
    on=true; x0=e.clientX; y0=e.clientY; tx0=HOMEV.tx; ty0=HOMEV.ty;
    st.setPointerCapture(e.pointerId); st.classList.add('grabbing'); };
  st.onpointermove=e=>{ if(!on)return;
    HOMEV.tx=tx0+(e.clientX-x0); HOMEV.ty=ty0+(e.clientY-y0); applyHomeT(); };
  const end=e=>{ on=false; st.classList.remove('grabbing');
    try{st.releasePointerCapture(e.pointerId);}catch(_){} };
  st.onpointerup=end; st.onpointercancel=end;
  st.addEventListener('wheel',e=>{ e.preventDefault();
    const r=st.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const nk=Math.max(0.25,Math.min(2.2,HOMEV.k*(e.deltaY<0?1.12:1/1.12)));
    HOMEV.tx=mx-(mx-HOMEV.tx)*(nk/HOMEV.k);
    HOMEV.ty=my-(my-HOMEV.ty)*(nk/HOMEV.k);
    HOMEV.k=nk; applyHomeT();
  },{passive:false});
}

/* 調查結果：任何登入的分析員都能增修（規格要求），與計畫本文的編輯權限分開 */
function renderHuntResults(){
  const host=$('#hunt-results'); if(!host)return;
  const h=findHunt(S.iId)||HUNTS[0]; if(!h)return;
  if(!h.results) h.results=(h.cases||[]).map(c=>({caseId:c, note:''}));
  host.innerHTML='';
  const used=new Set(h.results.map(r=>r.caseId));
  const avail=CASES.filter(c=>!used.has(c.id))
    .sort((a,b)=>b.occur[0].localeCompare(a.occur[0]));

  host.append(el('div',{class:'hr-add'},
    el('select',{class:'inp', id:'hr-pick','aria-label':'選擇調查報告'},
      el('option',{value:''},`選擇調查報告…（共 ${avail.length} 份可選）`),
      ...avail.map(c=>el('option',{value:c.id},
        `${c.id} · ${c.sev} · ${c.title.length>34?c.title.slice(0,34)+'…':c.title}`))),
    el('button',{class:'btn btn-sm btn-primary', onclick:()=>{
      const v=$('#hr-pick').value; if(!v){toast('請先選擇一份調查報告'); return;}
      h.results.push({caseId:v, note:'', by:S.me, at:nowStamp()});
      h.cases=h.results.map(r=>r.caseId);
      persist(); renderHuntResults(); toast(`已連結 ${v}`);
    }}, el('span',{html:svgIcon(I.plus)}),'加入')));

  if(!h.results.length){
    host.append(el('p',{style:'font-size:12.5px;color:var(--ink-3);margin-top:11px'},
      '本計畫尚未命中任何案件。'));
  } else {
    host.append(el('div',{class:'hr-list'}, ...h.results.map((r,i)=>{
      const c=CASES.find(y=>y.id===r.caseId);
      return el('div',{class:'hr-item'},
        el('div',{class:'hr-head'},
          el('i',{class:'bar', style:`background:${c?SEV_COLOR[c.sev]:'var(--rule-2)'}`}),
          el('button',{class:'hr-link', onclick:()=>crossGo({app:'cases', route:'detail', caseId:r.caseId})},
            c?c.title:'（案件已不存在）',
            el('small',{}, c?`${c.id} · ${c.cat} · ${c.occur[0]}`:r.caseId)),
          el('button',{class:'iconbtn', title:'移除此連結', 'aria-label':'移除此連結',
            onclick:()=>{ h.results.splice(i,1); h.cases=h.results.map(x=>x.caseId);
              persist(); renderHuntResults(); }, html:svgIcon(I.trash)})),
        el('input',{class:'inp hr-note', value:r.note||'',
          placeholder:'補充資訊（選填）：命中情形、誤報判定、後續處置…',
          oninput:e=>{ r.note=e.target.value; r.by=S.me; r.at=nowStamp(); },
          onchange:()=>persist()}));
    })));
  }
  host.append(el('div',{class:'hr-extra'},
    el('div',{class:'conn-lbl'},'整體補充資訊（選填）'),
    el('textarea',{class:'inp', style:'min-height:72px',
      placeholder:'此計畫的整體發現、限制或後續建議。', value:h.resultNote||'',
      oninput:e=>{h.resultNote=e.target.value;}, onchange:()=>persist()}, h.resultNote||'')));
}

              placeholder:'與本環境的相關性、佐證、建議處置。'}, x?x.analysis:'')))),
      el('section',{class:'card sec'}, el('h3',{},'IOC'),
        el('p',{style:'font-size:12px;color:var(--ink-3);margin-bottom:9px'},
          '可新增多筆；型別與案件系統一致。'),
        el('div',{class:'rowlist', id:'in-ioc-list'}),
        el('button',{class:'btn btn-sm', style:'margin-top:9px',
          onclick:()=>{S.iform.iocs.push({t:'ip',v:'',n:''}); renderIntelIocs();}},
          el('span',{html:svgIcon(I.plus)}),'新增指標')),
      ttpSection('TTP','此情資所述及的技術，熱圖會納入比對。'),
      actions());
  }

  const h=editing?findHunt(S.iId):null;
  return el('div',{class:'wrap'},
    head(editing?'編輯威脅獵補計畫':'建立威脅獵補計畫',
         editing?`${h.id} · 建立時間不變`:'儲存後系統自動配發計畫編號'),
    el('section',{class:'card sec'}, el('h3',{},'基本資料'),
      el('div',{class:'form-grid'},
        el('div',{class:'field'}, el('label',{},'獵補計畫 ID'),
          el('input',{class:'inp mono', readonly:true, value:h?h.id:`${nextIntelId('HUNT')}（儲存時配發）`})),
        el('div',{class:'field'}, el('label',{},'建立時間'),
          el('input',{class:'inp mono', readonly:true, value:h?h.created:nowStamp()})),
        el('div',{class:'field full'}, el('label',{},'狀態',el('span',{class:'req'},'*')),
          el('div',{class:'radios'}, ...['未開始','進行中','已完成'].map(v=>
            radio('hstatus', v, h?h.status===v:v==='未開始')))))),
    ttpSection('TTP ID','本計畫鎖定的技術。'),
    ...HUNT_FIELDS.map(([k,label,hint])=>el('section',{class:'card sec'},
      el('h3',{},label),
      el('p',{style:'font-size:11.5px;color:var(--ink-3);margin-bottom:9px'},hint),
      el('textarea',{class:'inp', id:'hf-'+k, style:'min-height:110px'}, h?(h[k]||''):''))),
    el('section',{class:'card sec'}, el('h3',{},'調查結果'),
      el('p',{style:'font-size:12.5px;color:var(--ink-2);line-height:1.7'},
        '調查結果開放給全體分析員增修，因此改在計畫的檢視頁面維護，不在此表單內。儲存後即可於該頁以下拉選單連結報告並填寫補充資訊。')),
    actions());
}

function ttpSection(title,hint){
  return el('section',{class:'card sec'},
    el('h3',{},title),
    el('p',{style:'font-size:12px;color:var(--ink-3);margin-bottom:9px'},hint),
    el('div',{class:'ttp', id:'if-ttp-list'}),
    el('button',{class:'btn btn-sm', style:'margin-top:9px', onclick:openIntelTtpPicker},
      el('span',{html:svgIcon(I.plus)}),'挑選技術'));
}

function renderAptTargets(){
  const host=$('#ap-tg'); if(!host)return; host.innerHTML='';
  S.iform.tags.forEach((t,i)=>host.append(el('span',{class:'tag'},t,
    el('button',{title:'移除', onclick:()=>{S.iform.tags.splice(i,1); renderAptTargets();},
      html:`<svg class="icon" style="width:11px;height:11px" viewBox="0 0 24 24">${I.close}</svg>`}))));
  host.append(el('input',{id:'ap-targets', placeholder:S.iform.tags.length?'再加一個…':'輸入後按 Enter 新增',
    onkeydown:e=>{ if(e.key==='Enter'&&e.target.value.trim()){e.preventDefault();
      S.iform.tags.push(e.target.value.trim()); renderAptTargets(); $('#ap-targets').focus();} }}));
}

function seedIntelForm(){
  const kind=S.iKind, id=S.iId;
  const base={_kind:kind, _id:id, ttps:[], iocs:[], tags:[], colorIdx:APTS.length%LAYER_COLORS.length, cases:[]};
  if(kind==='apt' && id){ const a=findApt(id);
    Object.assign(base,{ttps:[...a.ttps], tags:[...a.targets], colorIdx:a.colorIdx}); }
  if(kind==='intel' && id){ const x=findIntel(id);
    Object.assign(base,{ttps:[...x.ttps], iocs:x.iocs.map(o=>({...o}))}); }
  if(kind==='hunt' && id){ const h=findHunt(id);
    Object.assign(base,{ttps:[...h.ttps], cases:[...h.cases]}); }
  if(kind==='intel' && !id) base.iocs=[{t:'ip',v:'',n:''}];
  S.iform=base;
}
function nextIntelId(pref){
  const arr = pref==='APT'?APTS : pref==='INTEL'?INTELS : HUNTS;
  const n=arr.map(x=>parseInt(x.id.slice(-4),10)).filter(x=>!isNaN(x));
  return `${pref}-${String(Math.max(0,...n)+1).padStart(4,'0')}`;
}
function renderIntelTtps(){
  const host=$('#if-ttp-list'); if(!host)return; host.innerHTML='';
  if(!S.iform.ttps.length){
    host.append(el('p',{style:'font-size:12.5px;color:var(--ink-3)'},'尚未挑選任何技術。')); return; }
  S.iform.ttps.forEach((tid,i)=>{
    const t=TECH_INDEX[tid]||{id:tid,name:'（未收錄）',tacticName:''};
    host.append(el('div',{class:'ttp-row'},
      el('span',{class:'ttp-id'},t.id), el('span',{},t.name),
      el('span',{class:'ttp-tac'},t.tacticName||''),
      el('button',{class:'iconbtn', style:'width:24px;height:24px;margin-left:6px', title:'移除',
        onclick:()=>{S.iform.ttps.splice(i,1); renderIntelTtps();}, html:svgIcon(I.close)})));
  });
}
function renderIntelIocs(){
  const host=$('#in-ioc-list'); if(!host)return; host.innerHTML='';
  S.iform.iocs.forEach((o,i)=>host.append(el('div',{class:'rowitem', style:'grid-template-columns:104px 1fr 1fr auto'},
    el('select',{class:'inp', 'aria-label':'指標型別', onchange:e=>{S.iform.iocs[i].t=e.target.value; renderIntelIocs();}},
      ...IOC_TYPES.map(([v,l])=>el('option',{value:v, selected:o.t===v?'':null},l))),
    el('input',{class:'inp mono', value:o.v, placeholder:IOC_PLACEHOLDER[o.t]||'',
      oninput:e=>S.iform.iocs[i].v=e.target.value}),
    el('input',{class:'inp', value:o.n||'', placeholder:'說明（選填）',
      oninput:e=>S.iform.iocs[i].n=e.target.value}),
    el('button',{class:'iconbtn', title:'移除', onclick:()=>{S.iform.iocs.splice(i,1);
      if(!S.iform.iocs.length)S.iform.iocs.push({t:'ip',v:'',n:''}); renderIntelIocs();},
      html:svgIcon(I.trash)}))));
}
function renderHuntCases(){
  const host=$('#hunt-cases'); if(!host)return; host.innerHTML='';
  const list=CASES.slice().sort((a,b)=>b.occur[0].localeCompare(a.occur[0])).slice(0,24);
  list.forEach(c=>{
    const on=S.iform.cases.includes(c.id);
    host.append(el('button',{class:'cp-item'+(on?' on':''),'aria-pressed':String(on),
      onclick:()=>{ const i=S.iform.cases.indexOf(c.id);
        if(i>=0)S.iform.cases.splice(i,1); else S.iform.cases.push(c.id);
        renderHuntCases(); }},
      el('span',{class:'cp-box'}, on?el('span',{html:`<svg class="icon" viewBox="0 0 24 24">${I.check}</svg>`}):null),
      el('i',{class:'bar', style:`background:${SEV_COLOR[c.sev]}`}),
      el('span',{class:'cp-txt'}, c.title, el('small',{},`${c.id} · ${c.cat}`))));
  });
}
function openIntelTtpPicker(){
  const sel=new Set(S.iform.ttps);
  const body=el('div',{class:'modal-body', id:'itp-body'});
  const draw=(q='')=>{
    body.innerHTML=''; let hits=0;
    ATTACK_FULL.forEach(t=>{
      const flat=t.techs.flatMap(x=>[{id:x.id,name:x.name,sub:false},
        ...x.subs.map(sb=>({id:sb.id,name:x.name+'：'+sb.name,sub:true}))]);
      const techs=flat.filter(x=>!q||(x.id+x.name+t.name).toLowerCase().includes(q.toLowerCase()));
      if(!techs.length)return; hits+=techs.length;
      body.append(el('div',{class:'tac-group'},
        el('div',{class:'tac-name'},`${t.id} ${t.name}`),
        ...techs.map(x=>el('button',{class:'tech'+(x.sub?' sub':''),'aria-pressed':String(sel.has(x.id)),
          onclick:e=>{ sel.has(x.id)?sel.delete(x.id):sel.add(x.id);
            e.currentTarget.setAttribute('aria-pressed',String(sel.has(x.id))); }},
          el('span',{class:'box', html:`<svg viewBox="0 0 24 24">${I.check}</svg>`}),
          el('span',{class:'tid'},x.id), el('span',{class:'tname'},x.name)))));
    });
    if(!hits) body.append(el('p',{class:'empty'},'查無符合的技術。'));
  };
  draw();
  const modal=el('div',{class:'modal'},
    el('div',{class:'modal-head'}, el('h3',{},'挑選 MITRE ATT&CK 技術'),
      el('button',{class:'iconbtn', onclick:closeOverlay, html:svgIcon(I.close), title:'關閉'})),
    el('div',{style:'padding:12px 18px 0'},
      el('input',{class:'inp', placeholder:'搜尋戰術、技術名稱或編號', oninput:e=>draw(e.target.value)})),
    body,
    el('div',{class:'modal-foot'},
      el('span',{class:'note', style:'font-size:11.5px;color:var(--ink-3);align-self:center'},
        `Enterprise 共 ${ATTACK_FULL.reduce((n,t)=>n+t.techs.length,0)} 項母技術、${ATTACK_FULL.reduce((n,t)=>n+t.techs.reduce((m,x)=>m+x.subs.length,0),0)} 項子技術`),
      el('span',{class:'spacer'}),
      el('button',{class:'btn', onclick:closeOverlay},'取消'),
      el('button',{class:'btn btn-primary', onclick:()=>{
        S.iform.ttps=[...sel]; closeOverlay(); renderIntelTtps(); toast(`已選取 ${sel.size} 項技術`);
      }},'確認選取')));
  const ov=$('#overlay'); ov.innerHTML='';
  ov.append(el('div',{class:'scrim', onclick:e=>{if(e.target===e.currentTarget)closeOverlay();}}, modal));
}

function saveIntelForm(){
  const v=sel=>{const n=$(sel); return n?n.value.trim():'';};
  const pick=n=>{const x=document.querySelector(`input[name="${n}"]:checked`); return x?x.value:'';};
  const kind=S.iKind, editing=!!S.iId, me=USERS[S.me];

  if(kind==='apt'){
    const name=v('#ap-name'); if(!name){toast('請填寫組織名稱'); $('#ap-name').focus(); return;}
    const desc=v('#ap-desc'); if(!desc){toast('請填寫敘述'); $('#ap-desc').focus(); return;}
    const id=editing?S.iId:nextIntelId('APT');
    const rec={id, name, type:v('#ap-type'), country:v('#ap-country'),
      colorIdx:S.iform.colorIdx, targets:[...S.iform.tags], ttps:[...S.iform.ttps],
      desc, analyst:editing?findApt(id).analyst:S.me,
      created:editing?findApt(id).created:nowStamp()};
    if(editing) Object.assign(findApt(id), rec); else APTS.push(rec);
    S.iId=id;
  } else if(kind==='intel'){
    const src=v('#in-src'); if(!src){toast('請填寫情資來源'); $('#in-src').focus(); return;}
    const content=v('#in-content'); if(!content){toast('請填寫情資內容'); $('#in-content').focus(); return;}
    const analysis=v('#in-analysis'); if(!analysis){toast('請填寫分析結果'); $('#in-analysis').focus(); return;}
    const id=editing?S.iId:nextIntelId('INTEL');
    const rec={id, created:editing?findIntel(id).created:nowStamp(), source:src,
      kind:pick('inkind')||'其他',
      analyst:editing?findIntel(id).analyst:S.me, content, analysis,
      iocs:S.iform.iocs.filter(o=>o.v.trim()).map(o=>({...o, v:o.v.trim()})),
      ttps:[...S.iform.ttps]};
    if(editing) Object.assign(findIntel(id), rec); else INTELS.unshift(rec);
    S.iId=id;
  } else {
    const hyp=v('#hf-hypothesis'); if(!hyp){toast('請填寫 Hypothesis'); $('#hf-hypothesis').focus(); return;}
    const id=editing?S.iId:nextIntelId('HUNT');
    const rec={id, created:editing?findHunt(id).created:nowStamp(),
      analyst:editing?findHunt(id).analyst:S.me, status:pick('hstatus')||'未開始',
      ttps:[...S.iform.ttps], cases:[...S.iform.cases]};
    HUNT_FIELDS.forEach(([k])=>rec[k]=v('#hf-'+k));
    if(editing) Object.assign(findHunt(id), rec); else HUNTS.unshift(rec);
    S.iId=id;
  }
  persist(); S.iform=null;
  toast(editing?'已儲存變更':'已建立並納入熱圖比對');
  go('detail');
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app=$('#app'); app.innerHTML='';
  if(S.route==='login'||!S.me){ app.append(viewLogin()); applyTheme(); return; }
  if(S.route==='pwchange' && (USERS[S.me]?.mustChangePassword || S.pwForced)){
    app.append(viewPwChange()); applyTheme(); return;
  }
  app.append(topbar());
  if(S.route==='pwchange'){ app.append(viewPwChange()); applyTheme(); return; }
  if(S.route==='audit'){ app.append(viewAudit()); applyTheme(); return; }
  const bb=backBar();
  if(bb){ const holder=el('div',{class:'wrap', style:'padding-bottom:0'}, bb); app.append(holder); }
  if(S.route==='users'){ app.append(viewUsers()); }
  else if(S.app==='rfi'){
    app.append(S.route==='detail' ? viewReq() : S.route==='form' ? viewReqForm() : viewReqDashboard());
  }else if(S.app==='asset'){
    app.append(S.route==='detail' ? viewAsset() : S.route==='form' ? viewAssetForm() : viewAssetDashboard());
  }else if(S.app==='topo'){
    app.append(viewTopo());
  }else if(S.app==='intel'){
    app.append(
      S.route==='matrix' ? viewMatrix() :
      S.route==='detail' ? viewIntelDetail() :
      S.route==='form'   ? viewIntelForm() : viewIntelDash());
    if(S.route==='form'){ setTimeout(()=>{ renderIntelTtps(); renderIntelIocs();
      renderAptTargets(); renderHuntCases(); },0); }
    if(S.route==='matrix' && S.mPanel==='mark') setTimeout(paintMarkList,0);
    if(S.route==='detail' && S.iKind==='hunt') setTimeout(renderHuntResults,0);
  }else{
    app.append(S.route==='detail' ? viewDetail() : S.route==='form' ? viewForm() : viewDashboard());
  }
  if(S.route!=='dashboard' || (S.backTo && S.backTo.app!==S.app)) app.append(bottomBar());
  applyTheme();
}

/* ============================================================
   開機
   ============================================================ */
async function boot(){
  try{
    // 展示模式的身分來自本地資料，需先載入才判斷得出
    if(STORE.mode==='demo') await STORE.load();

    const me = await STORE.session();
    if(!me){ S.route='login'; render(); return; }

    USERS[me.id] = USERS[me.id] || {id:me.id, name:me.name, role:me.role, perm:me.perm};
    S.me = me.id;

    if(me.mustChangePassword){ S.route='pwchange'; render(); return; }

    await STORE.load();
    S.route='dashboard';
    render();
    subscribeLive();
  }catch(err){
    S.route='login'; render();
    toast('初始化失敗：' + (err.message||err));
  }
}
boot();
</script>
