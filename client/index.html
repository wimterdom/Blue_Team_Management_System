<title>藍隊管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — light is the base; dark redefines tokens only.
   ============================================================ */
:root{
  color-scheme: light;
  --plane:#eceef1;      --surface:#fbfcfd;    --surface-2:#f3f5f8;  --surface-3:#e9ecf1;
  --ink:#0f1620;        --ink-2:#4b5663;      --ink-3:#7d8894;
  --rule:#dfe3e9;       --rule-2:#cdd4dd;
  --accent:#1e4d8c;     --accent-ink:#ffffff; --accent-wash:rgba(30,77,140,.09);
  --data:#2a78d6;       --data-fill:rgba(42,120,214,.14);
  --grid:#e4e7ec;       --axis:#c9cfd8;
  --emph:#d03b3b;       --neutral-1:#6f7b89;  --neutral-2:#c2cad4;
  --shadow:0 1px 2px rgba(15,22,32,.05), 0 8px 24px -12px rgba(15,22,32,.16);
  --shadow-lg:0 2px 6px rgba(15,22,32,.08), 0 24px 60px -20px rgba(15,22,32,.28);
  /* status — fixed, never themed */
  --critical:#d03b3b;   --serious:#ec835a;    --warning:#fab219;    --good:#0ca30c;
  --sans:"IBM Plex Sans TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px; --r-lg:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0b0e13;    --surface:#141920;    --surface-2:#1b212a;  --surface-3:#232b36;
    --ink:#eef1f5;      --ink-2:#a3adba;      --ink-3:#6e7a88;
    --rule:#262d38;     --rule-2:#333c49;
    --accent:#6aa5f2;   --accent-ink:#0b0e13; --accent-wash:rgba(106,165,242,.14);
    --data:#3987e5;     --data-fill:rgba(57,135,229,.20);
    --grid:#212832;     --axis:#333c49;
    --emph:#d03b3b;     --neutral-1:#8b96a3;  --neutral-2:#3a434f;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 60px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0b0e13;      --surface:#141920;    --surface-2:#1b212a;  --surface-3:#232b36;
  --ink:#eef1f5;        --ink-2:#a3adba;      --ink-3:#6e7a88;
  --rule:#262d38;       --rule-2:#333c49;
  --accent:#6aa5f2;     --accent-ink:#0b0e13; --accent-wash:rgba(106,165,242,.14);
  --data:#3987e5;       --data-fill:rgba(57,135,229,.20);
  --grid:#212832;       --axis:#333c49;
  --emph:#d03b3b;       --neutral-1:#8b96a3;  --neutral-2:#3a434f;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 60px -20px rgba(0,0,0,.85);
}

/* 請求管理系統換一組主色，讓「我在哪個系統」不必靠讀字判斷。
   只動 accent，其餘中性色與資料色完全共用。 */
:root[data-app="rfi"]{
  --accent:#0f5f63; --accent-ink:#ffffff; --accent-wash:rgba(15,95,99,.10);
}
@media (prefers-color-scheme: dark){
  :root[data-app="rfi"]:not([data-theme="light"]){
    --accent:#5cc0c4; --accent-ink:#06211f; --accent-wash:rgba(92,192,196,.15);
  }
}
:root[data-app="rfi"][data-theme="dark"]{
  --accent:#5cc0c4; --accent-ink:#06211f; --accent-wash:rgba(92,192,196,.15);
}
:root[data-app="asset"]{
  --accent:#5a3fa0; --accent-ink:#ffffff; --accent-wash:rgba(90,63,160,.10);
}
@media (prefers-color-scheme: dark){
  :root[data-app="asset"]:not([data-theme="light"]){
    --accent:#a897f0; --accent-ink:#14102b; --accent-wash:rgba(168,151,240,.15);
  }
}
:root[data-app="asset"][data-theme="dark"]{
  --accent:#a897f0; --accent-ink:#14102b; --accent-wash:rgba(168,151,240,.15);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent); text-decoration:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---------- shared atoms ---------- */
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3);
}
.card{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-lg); box-shadow:var(--shadow);
}
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r);
  font-size:13px; font-weight:500; cursor:pointer; transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--surface-2); border-color:var(--ink-3)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent); border-color:var(--accent); filter:brightness(1.08)}
.btn-danger{color:var(--critical); border-color:color-mix(in srgb, var(--critical) 40%, transparent)}
.btn-danger:hover{background:color-mix(in srgb, var(--critical) 10%, transparent); border-color:var(--critical)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn-sm{padding:4px 9px; font-size:12px}
.icon{width:15px; height:15px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

/* chip: colour is never the only cue — dot + text label always ship together */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:2px 8px 2px 7px;
  border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap;
  border:1px solid var(--rule-2); background:var(--surface-2); color:var(--ink);
}
.chip .dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--ink-3)}
.chip[data-s="危急"]{border-color:color-mix(in srgb,var(--critical) 45%,transparent); background:color-mix(in srgb,var(--critical) 12%,transparent)}
.chip[data-s="危急"] .dot{background:var(--critical)}
.chip[data-s="高"]{border-color:color-mix(in srgb,var(--serious) 50%,transparent); background:color-mix(in srgb,var(--serious) 14%,transparent)}
.chip[data-s="高"] .dot{background:var(--serious)}
.chip[data-s="中"]{border-color:color-mix(in srgb,var(--warning) 52%,transparent); background:color-mix(in srgb,var(--warning) 15%,transparent)}
.chip[data-s="中"] .dot{background:var(--warning)}
.chip[data-s="低"]{border-color:color-mix(in srgb,var(--good) 42%,transparent); background:color-mix(in srgb,var(--good) 11%,transparent)}
.chip[data-s="低"] .dot{background:var(--good)}
.chip[data-v="惡意行為"]{border-color:color-mix(in srgb,var(--critical) 45%,transparent); background:color-mix(in srgb,var(--critical) 12%,transparent)}
.chip[data-v="惡意行為"] .dot{background:var(--critical)}
.chip[data-v="授權行為"] .dot{background:var(--neutral-1)}
.chip[data-v="正常行為"] .dot{background:var(--good)}
.chip[data-v="未判定"]{border-style:dashed}
.chip[data-p="進行中"] .dot{background:var(--warning); box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 22%,transparent)}
.chip[data-p="已完成"] .dot{background:var(--ink-3)}
.tag{
  display:inline-flex; align-items:center; padding:1px 7px; border-radius:var(--r);
  background:var(--surface-3); color:var(--ink-2);
  font-family:var(--mono); font-size:11px; white-space:nowrap;
}

/* ---------- top command bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:16px;
  height:56px; padding:0 22px; background:var(--surface);
  border-bottom:1px solid var(--rule);
}
.brand{
  display:flex; align-items:center; gap:10px; cursor:pointer; padding:5px 9px 5px 5px;
  background:none; border:1px solid transparent; border-radius:var(--r); margin-left:-5px;
}
.brand:hover{background:var(--surface-2); border-color:var(--rule)}
.brand-caret{font-size:9px; color:var(--ink-3); margin-left:2px}
/* 系統切換選單靠左，對齊左上角的切換按鈕（.brand 的 border box 起於 17px）。
   用 .menu.appmenu 提高權重，否則後面 .menu 的 right:22px 會讓選單被撐滿整列。 */
.menu.appmenu{min-width:296px; width:max-content; max-width:min(360px,calc(100vw - 34px)); left:17px; right:auto}
.appmi{align-items:flex-start; gap:11px; padding:9px 11px}
.appmi-mark{
  width:28px; height:28px; flex:none; border-radius:6px; display:grid; place-items:center;
  background:var(--surface-3); color:var(--ink-2);
}
.appmi[aria-current="true"] .appmi-mark{background:var(--accent); color:var(--accent-ink)}
.appmi-mark svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8}
.appmi-txt{flex:1; min-width:0; line-height:1.4}
.appmi-txt small{display:block; font-size:11px; color:var(--ink-3); font-weight:400; margin-top:1px}
.appmi-now{display:grid; color:var(--accent); flex:none; margin-top:2px}
.appmi-now svg{width:15px; height:15px}
.brand-mark{
  width:26px; height:26px; border-radius:5px; background:var(--accent); flex:none;
  display:grid; place-items:center;
}
.brand-mark svg{width:15px; height:15px; stroke:var(--accent-ink); fill:none; stroke-width:1.9}
.brand-name{font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.brand-sub{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase}
.search{position:relative; flex:1; max-width:420px; margin-left:12px}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--ink-3); fill:none; stroke-width:1.8; pointer-events:none}
.search input{
  width:100%; padding:7px 11px 7px 32px; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:var(--r); font-size:13px;
}
.search input::placeholder{color:var(--ink-3)}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.iconbtn{
  display:grid; place-items:center; width:32px; height:32px; padding:0;
  background:none; border:1px solid transparent; border-radius:var(--r); cursor:pointer; color:var(--ink-2);
}
.iconbtn:hover{background:var(--surface-2); border-color:var(--rule); color:var(--ink)}
.user{display:flex; align-items:center; gap:9px; padding:4px 9px 4px 4px; background:none; border:1px solid var(--rule); border-radius:999px; cursor:pointer}
.user:hover{background:var(--surface-2)}
.avatar{
  width:24px; height:24px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:600;
}
.user-name{font-size:12.5px; font-weight:500; line-height:1.2}
.user-role{font-size:10.5px; color:var(--ink-3); line-height:1.2}

/* ---------- page shell ---------- */
.wrap{max-width:1320px; margin:0 auto; padding:22px 22px 64px}
.page-head{display:flex; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.page-head h1{font-size:21px; letter-spacing:-.015em}
.page-head .sub{color:var(--ink-2); font-size:13px}
.head-actions{margin-left:auto; display:flex; gap:8px}

/* ---------- KPI ---------- */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px}
.kpi{padding:15px 17px 14px; display:flex; flex-direction:column; gap:2px}
.kpi .val{font-size:32px; font-weight:600; letter-spacing:-.025em; line-height:1.12}
.kpi .val small{font-size:14px; font-weight:500; color:var(--ink-3); margin-left:3px}
.kpi .foot{display:flex; align-items:center; gap:6px; margin-top:5px; font-size:12px; color:var(--ink-2)}
.delta{display:inline-flex; align-items:center; gap:3px; font-family:var(--mono); font-size:11.5px; font-weight:500}
.delta.up{color:var(--critical)} .delta.down{color:var(--good)}
.delta svg{width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2.2}
.kpi-rule{height:3px; border-radius:2px; background:var(--surface-3); margin-top:11px; overflow:hidden}
.kpi-rule i{display:block; height:100%; border-radius:2px}

/* ---------- chart grid ---------- */
.charts{display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-bottom:14px; align-items:stretch}
.charts .col{display:flex; flex-direction:column; gap:14px}
.charts > .card.panel{display:flex; flex-direction:column}
.charts > .card.panel > .chart-host{flex:1; min-height:210px}
.panel{padding:16px 18px 14px}
.panel-head{display:flex; align-items:baseline; gap:10px; margin-bottom:2px}
.panel-head h3{font-size:13.5px}
.panel-head .note{margin-left:auto; font-size:11.5px; color:var(--ink-3)}
.chart-host{position:relative; margin-top:12px}
.chart-host svg{display:block}
.tip{
  position:absolute; z-index:20; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
  padding:7px 10px; background:var(--surface); border:1px solid var(--rule-2);
  border-radius:var(--r); box-shadow:var(--shadow-lg); white-space:nowrap; transition:opacity .09s;
}
.tip .t-d{font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.tip .t-v{font-size:13px; font-weight:600}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px}
.lg{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-2)}
.lg i{width:9px; height:9px; border-radius:2px; flex:none}
.lg b{color:var(--ink); font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums}

/* ---------- filter bar + table ---------- */
.filters{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:11px 16px; border-bottom:1px solid var(--rule)}
.fchip{
  padding:4px 11px; background:transparent; border:1px solid var(--rule-2);
  border-radius:999px; font-size:12.5px; cursor:pointer; color:var(--ink-2);
}
.fchip:hover{border-color:var(--ink-3); color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
.fsep{width:1px; height:18px; background:var(--rule); margin:0 3px}
.sortnote{
  margin-left:auto; display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-3);
}
/* ---------- RFI / CR ---------- */
.rtype{
  display:inline-block; padding:1px 7px; border-radius:4px; font-family:var(--mono);
  font-size:10.5px; font-weight:600; letter-spacing:.06em;
}
.rtype-RFI{background:color-mix(in srgb,var(--data) 18%,transparent); color:var(--data);
           border:1px solid color-mix(in srgb,var(--data) 42%,transparent)}
.rtype-CR{background:var(--surface-3); color:var(--ink-2); border:1px solid var(--rule-2)}
.chip[data-rp="進行中"] .dot{background:var(--warning); box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 22%,transparent)}
.chip[data-rp="已完成"] .dot{background:var(--good)}
.chip[data-rp="未提交"]{border-style:dashed}
.chip[data-rp="未提交"] .dot{background:var(--ink-3)}
.tag-replied{background:color-mix(in srgb,var(--good) 16%,transparent); color:var(--ink)}
.reply-sec{border-left:2px solid var(--accent)}
.reply-mark{display:grid; color:var(--accent); flex:none}
.reply-mark svg{width:16px; height:16px}
.await{
  display:flex; align-items:center; gap:9px; padding:13px 15px; font-size:12.5px; line-height:1.7;
  color:var(--ink-2); background:var(--surface-2); border:1px dashed var(--rule-2); border-radius:var(--r);
}
.steps{display:flex; flex-direction:column; gap:0}
.step{display:flex; align-items:center; gap:10px; padding:7px 0; position:relative}
.step:not(:last-child)::before{content:""; position:absolute; left:11px; top:26px; bottom:-7px; width:1px; background:var(--rule-2)}
.step-dot{
  width:23px; height:23px; flex:none; border-radius:50%; display:grid; place-items:center; z-index:1;
  font-family:var(--mono); font-size:10.5px; background:var(--surface-2);
  border:1px solid var(--rule-2); color:var(--ink-3);
}
.step.done .step-dot{background:var(--good); border-color:var(--good); color:#fff}
.step.now .step-dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.step-t{font-size:12.5px; color:var(--ink-3)}
.step.done .step-t{color:var(--ink-2)}
.step.now .step-t{color:var(--ink); font-weight:600}

/* ---------- 資產管理 ---------- */
.chip[data-imp="關鍵"]{border-color:color-mix(in srgb,var(--critical) 45%,transparent); background:color-mix(in srgb,var(--critical) 12%,transparent)}
.chip[data-imp="關鍵"] .dot{background:var(--critical)}
.chip[data-imp="高"]{border-color:color-mix(in srgb,var(--serious) 50%,transparent); background:color-mix(in srgb,var(--serious) 14%,transparent)}
.chip[data-imp="高"] .dot{background:var(--serious)}
.chip[data-imp="中"]{border-color:color-mix(in srgb,var(--warning) 52%,transparent); background:color-mix(in srgb,var(--warning) 15%,transparent)}
.chip[data-imp="中"] .dot{background:var(--warning)}
.chip[data-imp="低"]{border-color:color-mix(in srgb,var(--good) 42%,transparent); background:color-mix(in srgb,var(--good) 11%,transparent)}
.chip[data-imp="低"] .dot{background:var(--good)}
.tag-todo{background:color-mix(in srgb,var(--warning) 18%,transparent); color:var(--ink); border:1px dashed color-mix(in srgb,var(--warning) 55%,transparent)}
.svc-tbl{min-width:0}
.svc-tbl th{background:transparent; padding:6px 10px 6px 0}
.svc-tbl td{padding:8px 10px 8px 0}
.svc-tbl tr{cursor:default}
.svc-tbl tbody tr:hover{background:transparent}
.svc-tbl tr:last-child td{border-bottom:0}
.svc-row{display:grid; grid-template-columns:1fr 96px 1.3fr auto; gap:8px; align-items:end}
.svc-row + .svc-row{margin-top:9px}
.svc-row .iconbtn{width:30px; height:30px; margin-bottom:1px}
.json{
  margin:0; padding:11px 12px; max-height:300px; overflow:auto;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
}
.json code{font-family:var(--mono); font-size:11px; line-height:1.65; color:var(--ink-2); white-space:pre}
@media (max-width:680px){ .svc-row{grid-template-columns:1fr 90px} }


/* ---------- 資產：新欄位、漏洞與附件 ---------- */
.charts2x2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px}
.charts2x2 > .card.panel{display:flex; flex-direction:column}
.charts2x2 > .card.panel > .chart-host{flex:1; min-height:168px}
/* 重要性是一條固定高度的堆疊長條，不該被拉開——否則圖例會被推到面板最底部 */
#as-imp{flex:0 0 auto; min-height:0}
.charts2x2 #lg-as-imp{margin-top:12px; margin-bottom:auto}
@media (max-width:1080px){ .charts2x2{grid-template-columns:1fr} }

.sub-line{font-size:10.5px; color:var(--ink-3); margin-top:2px; line-height:1.4}
.ipflag{
  display:inline-block; margin-left:6px; padding:0 5px; border-radius:3px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.05em;
  background:var(--accent-wash); color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
}
.chip[data-vul="危急"]{border-color:color-mix(in srgb,var(--critical) 45%,transparent); background:color-mix(in srgb,var(--critical) 12%,transparent)}
.chip[data-vul="危急"] .dot{background:var(--critical)}
.chip[data-vul="高"]{border-color:color-mix(in srgb,var(--serious) 50%,transparent); background:color-mix(in srgb,var(--serious) 14%,transparent)}
.chip[data-vul="高"] .dot{background:var(--serious)}
.chip[data-vul="中"]{border-color:color-mix(in srgb,var(--warning) 52%,transparent); background:color-mix(in srgb,var(--warning) 15%,transparent)}
.chip[data-vul="中"] .dot{background:var(--warning)}
.chip[data-vul="低"]{border-color:color-mix(in srgb,var(--good) 42%,transparent); background:color-mix(in srgb,var(--good) 11%,transparent)}
.chip[data-vul="低"] .dot{background:var(--good)}
.tag-urgent{
  background:color-mix(in srgb,var(--critical) 16%,transparent); color:var(--ink);
  border:1px solid color-mix(in srgb,var(--critical) 45%,transparent); font-weight:500;
}

.vuls{display:flex; flex-direction:column; gap:9px}
.vul{padding:11px 13px; background:var(--surface-2); border:1px solid var(--rule); border-left-width:3px;
     border-left-color:var(--rule-2); border-radius:var(--r)}
.vul.urgent{border-left-color:var(--critical)}
.vul-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.vul-id{font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--ink)}
.vul-comp{font-size:11.5px; color:var(--ink-3); margin-left:auto; font-family:var(--mono)}
.vul-note{margin-top:7px; font-size:12.5px; line-height:1.7}
.vul-note p{margin:0}
.vul-grid{display:grid; grid-template-columns:1fr 1fr 110px auto; gap:8px; align-items:end}
.vul-urgent{
  display:inline-flex; align-items:center; gap:7px; padding:7px 11px; cursor:pointer; white-space:nowrap;
  border:1px solid var(--rule-2); border-radius:var(--r); background:var(--surface); font-size:12.5px;
}
.vul-urgent input{position:absolute; opacity:0; width:0; height:0}
.vul-box{width:14px; height:14px; flex:none; border:1.5px solid var(--rule-2); border-radius:3px; display:grid; place-items:center}
.vul-box svg{width:9px; height:9px; stroke:#fff; fill:none; stroke-width:3; opacity:0}
.vul-urgent:has(input:checked){border-color:var(--critical); background:color-mix(in srgb,var(--critical) 10%,transparent); font-weight:500}
.vul-urgent:has(input:checked) .vul-box{background:var(--critical); border-color:var(--critical)}
.vul-urgent:has(input:checked) .vul-box svg{opacity:1}
.vul-urgent:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
@media (max-width:680px){ .vul-grid{grid-template-columns:1fr 1fr} }

.files{display:flex; flex-direction:column; gap:8px}
.file-item{border:1px solid var(--rule); border-radius:var(--r); overflow:hidden; background:var(--surface-2)}
.file-head{
  display:flex; align-items:center; gap:9px; width:100%; padding:9px 11px; cursor:pointer;
  background:none; border:0; text-align:left;
}
.file-head:hover{background:var(--surface-3)}
.file-caret{font-size:10px; color:var(--ink-3); width:10px; flex:none}
.file-ext{
  flex:none; padding:1px 6px; border-radius:3px; background:var(--surface-3); color:var(--ink-2);
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em;
}
.file-name{font-family:var(--mono); font-size:12px; color:var(--ink); word-break:break-all}
.file-meta{font-size:10.5px; color:var(--ink-3); font-family:var(--mono); white-space:nowrap}
.file-body{border-top:1px solid var(--rule)}
.file-bar{display:flex; align-items:center; gap:10px; padding:8px 11px; background:var(--surface)}
.file-bar .file-meta{flex:1}
.file-pre{margin:0; padding:11px 13px; max-height:420px; overflow:auto; background:var(--surface)}
.file-pre code{font-family:var(--mono); font-size:11px; line-height:1.65; color:var(--ink-2); white-space:pre}
.file-row{
  display:flex; align-items:center; gap:10px; padding:9px 11px;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
}
.file-row + .file-row{margin-top:8px}


/* 中國製造標註：⚑ 加暖警示色。這不是「危險」，而是「需依供應鏈政策檢視」，
   所以用 serious 而非 critical，避免和漏洞的危急等級搶注意力。 */
.prc-mark{color:var(--serious); font-size:11px; line-height:1; flex:none}
.prc-line{color:var(--serious); display:flex; align-items:center; gap:4px}
.prc-badge{
  display:inline-flex; align-items:center; gap:6px; padding:2px 9px 2px 8px;
  font-size:12.5px; border-radius:999px;
  background:color-mix(in srgb,var(--serious) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--serious) 50%,transparent);
}
.prc-kpi{
  display:inline-flex; align-items:center; gap:4px; margin-left:8px;
  font-size:11.5px; color:var(--serious); font-weight:500;
}
.prc-chip{display:inline-flex; align-items:center; gap:6px}
.prc-chip[aria-pressed="true"]{
  background:var(--serious); border-color:var(--serious); color:#1b0d05; font-weight:600;
}
.prc-chip[aria-pressed="true"] .prc-mark{color:#1b0d05}


/* ---------- 主機標定系統 ---------- */
:root[data-app="topo"]{
  --accent:#7a5218; --accent-ink:#ffffff; --accent-wash:rgba(122,82,24,.11);
}
@media (prefers-color-scheme: dark){
  :root[data-app="topo"]:not([data-theme="light"]){
    --accent:#d9a441; --accent-ink:#22190a; --accent-wash:rgba(217,164,65,.15);
  }
}
:root[data-app="topo"][data-theme="dark"]{
  --accent:#d9a441; --accent-ink:#22190a; --accent-wash:rgba(217,164,65,.15);
}

.topo-wrap{max-width:1560px}
.topo-bar{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:11px 15px; margin-bottom:12px;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); box-shadow:var(--shadow);
}
.topo-toggle{
  display:inline-flex; align-items:center; gap:7px; padding:5px 11px; cursor:pointer; font-size:12.5px;
  border:1px solid var(--rule-2); border-radius:999px; background:var(--surface-2); white-space:nowrap;
}
.topo-toggle input{position:absolute; opacity:0; width:0; height:0}
.tg-box{width:12px; height:12px; flex:none; border:1.5px solid var(--rule-2); border-radius:3px}
.topo-toggle:has(input:checked){border-color:var(--accent); background:var(--accent-wash); font-weight:500}
.topo-toggle:has(input:checked) .tg-box{background:var(--accent); border-color:var(--accent)}
.topo-toggle:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
.topo-stat{display:flex; align-items:center; gap:6px; margin-left:auto; font-size:12px; color:var(--ink-2); white-space:nowrap}
.ts-dot{width:8px; height:8px; border-radius:50%; display:inline-block}
.ts-dot.hit{background:var(--critical)}
.ts-dot.flow{background:var(--critical); border-radius:1px; width:14px; height:2px}
.ts-sep{width:1px; height:14px; background:var(--rule); margin:0 4px}
.topo-zoom{display:flex; align-items:center; gap:5px}
.topo-note{max-width:none; flex:1; display:flex; align-items:center}

.topo-hint{
  display:flex; align-items:center; gap:9px; padding:9px 14px; margin-bottom:12px; font-size:12.5px;
  color:var(--ink-2); background:color-mix(in srgb,var(--critical) 8%,transparent);
  border:1px dashed color-mix(in srgb,var(--critical) 45%,transparent); border-radius:var(--r);
}
.sensor-mark{color:var(--critical); font-weight:700; line-height:1}

.topo-stage{
  position:relative; height:min(68vh,720px); overflow:hidden; touch-action:none;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); box-shadow:var(--shadow);
  background-image:radial-gradient(var(--rule) 1px, transparent 1px);
  background-size:22px 22px;
}
.topo-svg{display:block; cursor:grab; width:100%; height:100%}
.topo-svg.grabbing{cursor:grabbing}
.topo-node{cursor:pointer}
.topo-node:hover rect{filter:brightness(1.06)}
.topo-node:focus-visible{outline:none}
.topo-node:focus-visible rect{stroke:var(--accent); stroke-width:2.2}
.topo-host{cursor:pointer}
.topo-host:hover text{fill:var(--accent)}

.topo-legend{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:12px; padding:10px 15px;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); font-size:12px;
}
.topo-legend .lg{gap:7px}
.lg-ico{width:11px; height:11px; border-radius:3px; border:1.5px solid var(--rule-2); background:var(--surface-2)}
.lg-ico.bad{border-color:var(--critical); background:color-mix(in srgb,var(--critical) 22%,transparent)}
.lg-ico.ext{border-style:dashed; border-color:var(--critical)}
.lg-arrow{width:20px; height:2px; background:var(--critical); position:relative; border-radius:1px}
.lg-arrow::after{content:''; position:absolute; right:-1px; top:-3px;
  border-left:6px solid var(--critical); border-top:4px solid transparent; border-bottom:4px solid transparent}

.topo-panel{margin-top:14px; padding:0; overflow:hidden}
.tp-head{display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--rule)}
.tp-ico{display:grid; place-items:center; width:38px; height:38px; flex:none;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:9px}
.tp-ico svg{fill:none; stroke:currentColor}
.tp-title{font-size:15px; font-weight:600; letter-spacing:-.01em}
.tp-sub{font-size:11.5px; color:var(--ink-3); margin-top:1px}
.tp-head .iconbtn{margin-left:auto}
.topo-panel .meta{padding:4px 16px 12px}
.tp-sec{padding:13px 16px; border-top:1px solid var(--rule)}
.tp-sensor{display:flex; align-items:center; gap:10px; background:var(--surface-2)}
.tp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:8px; padding:14px 16px}
.tp-cell{
  display:flex; flex-direction:column; gap:2px; padding:8px 10px; cursor:pointer; text-align:left;
  background:var(--surface-2); border:1px solid var(--rule); border-left-width:3px; border-radius:var(--r);
  font-size:12.5px;
}
.tp-cell:hover{border-color:var(--ink-3); background:var(--surface-3)}
.tp-cell small{font-size:10.5px; color:var(--ink-3)}
.tp-cell.bad{border-left-color:var(--critical); color:var(--critical)}
.tp-cell.bad small{color:color-mix(in srgb,var(--critical) 70%,var(--ink-3))}
@media (max-width:900px){ .topo-stat{margin-left:0; width:100%} }


.backbar{
  display:flex; align-items:center; gap:10px; padding:10px 15px; margin-bottom:14px;
  font-size:12.5px; color:var(--ink-2); border-left:2px solid var(--accent);
}
.sensor-panel{margin-bottom:12px; padding:0; overflow:hidden}
.sp-head{display:flex; align-items:flex-start; gap:11px; padding:13px 16px; border-bottom:1px solid var(--rule)}
.sp-head .sensor-mark{font-size:18px; margin-top:1px}
.sp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:8px; padding:14px 16px}
.sp-gw{
  display:flex; align-items:center; gap:9px; padding:8px 11px; cursor:pointer; text-align:left;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
}
.sp-gw:hover{border-color:var(--ink-3)}
.sp-gw.on{border-color:var(--critical); background:color-mix(in srgb,var(--critical) 9%,transparent)}
.sp-box{
  width:16px; height:16px; flex:none; display:grid; place-items:center; border-radius:4px;
  border:1.5px solid var(--rule-2); background:var(--surface);
}
.sp-gw.on .sp-box{background:var(--critical); border-color:var(--critical)}
.sp-star{color:#fff; font-size:11px; font-weight:700; line-height:1}
.sp-ico{display:grid; place-items:center; flex:none}
.sp-ico svg{fill:none; stroke:currentColor}
.sp-txt{flex:1; min-width:0; font-size:12.5px; line-height:1.35}
.sp-txt small{display:block; font-size:10.5px; color:var(--ink-3); font-family:var(--mono)}
.sp-tag{
  flex:none; padding:1px 7px; border-radius:999px; font-family:var(--mono); font-size:10.5px;
  font-weight:700; background:var(--critical); color:#fff;
}
.sp-foot{display:flex; align-items:center; gap:10px; padding:11px 16px; border-top:1px solid var(--rule); background:var(--surface-2)}
.sensor-badge{pointer-events:none}
@keyframes flowdash{ to{ stroke-dashoffset:-40; } }
.flow-dash{animation:flowdash 1.6s linear infinite}
@media (prefers-reduced-motion: reduce){ .flow-dash{animation:none} }


.sp-list{display:flex; flex-direction:column; gap:7px; padding:14px 16px}
.sp-dev{border:1px solid var(--rule); border-radius:var(--r); overflow:hidden; background:var(--surface-2)}
.sp-dev.on{border-color:color-mix(in srgb,var(--critical) 45%,transparent)}
.sp-dev-head{display:flex; align-items:center; gap:9px; width:100%; padding:9px 11px; cursor:pointer;
  background:none; border:0; text-align:left}
.sp-dev-head:hover{background:var(--surface-3)}
.sp-caret{font-size:10px; color:var(--ink-3); width:10px; flex:none}
.sp-ports{display:flex; flex-direction:column; gap:4px; padding:4px 10px 10px 32px; border-top:1px solid var(--rule)}
.tp-ports{padding:0}
.sp-port{
  display:flex; align-items:center; gap:9px; padding:6px 10px; cursor:pointer; text-align:left;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); font-size:12px;
}
.sp-port:hover{border-color:var(--ink-3)}
.sp-port.on{border-color:var(--critical); background:color-mix(in srgb,var(--critical) 10%,transparent)}
.sp-if{flex:none; width:96px; font-size:11.5px; color:var(--ink)}
.sp-role{flex:none; width:64px; font-size:10.5px; color:var(--ink-3)}
.sp-to{flex:1; min-width:0; font-size:11px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis}


/* ---------- 情資管理系統 ---------- */
:root[data-app="intel"]{
  --accent:#8f2f5e; --accent-ink:#ffffff; --accent-wash:rgba(143,47,94,.10);
}
@media (prefers-color-scheme: dark){
  :root[data-app="intel"]:not([data-theme="light"]){
    --accent:#e79ac0; --accent-ink:#2a0a1a; --accent-wash:rgba(231,154,192,.15);
  }
}
:root[data-app="intel"][data-theme="dark"]{
  --accent:#e79ac0; --accent-ink:#2a0a1a; --accent-wash:rgba(231,154,192,.15);
}

.risk-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px}
@media (max-width:1080px){ .risk-row{grid-template-columns:1fr} }
.risk-card,.heat-card{display:flex; flex-direction:column}
.risk-main{display:flex; align-items:center; gap:18px; margin-top:12px}
.risk-dial{width:104px; height:104px; flex:none}
.risk-side{flex:1; min-width:0}
.risk-level{font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
.risk-score{font-size:19px; font-weight:600; margin-top:2px}
.risk-score small{font-size:12px; color:var(--ink-3); font-weight:400}
.risk-note{font-size:11.5px; color:var(--ink-2); margin-top:7px; line-height:1.7}
.risk-formula{margin-top:14px; padding-top:12px; border-top:1px solid var(--rule)}
.risk-formula code{
  display:block; margin:7px 0; padding:8px 10px; font-family:var(--mono); font-size:11px;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r); color:var(--ink-2);
}
.risk-hint{font-size:11px; color:var(--ink-3); line-height:1.7}
.risk-scale{display:flex; gap:6px; margin-top:11px; flex-wrap:wrap}
.rs{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px;
  font-size:11px; color:var(--ink-3); border:1px solid var(--rule)}
.rs i{width:8px; height:8px; border-radius:50%; background:var(--c)}
.rs.on{border-color:var(--c); color:var(--ink); font-weight:600; background:color-mix(in srgb,var(--c) 12%,transparent)}

.heat-mini{
  flex:1; display:flex; flex-direction:column; gap:8px; margin-top:12px; padding:10px;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r); cursor:pointer;
}
.heat-mini:hover{border-color:var(--accent)}
.heat-mini-svg{flex:1; min-height:150px; overflow:hidden; display:flex}
.heat-mini-svg svg{max-height:200px}
.heat-mini-cta{font-size:12px; color:var(--accent); font-weight:500; text-align:right}

.intel-2col{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:1080px){ .intel-2col{grid-template-columns:1fr} }
.apt-swatch{width:12px; height:12px; border-radius:3px; display:inline-block; flex:none}

.heat-legend{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 15px; margin-bottom:12px;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); font-size:12px;
}
.hl{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2)}
.hl i{width:11px; height:11px; border-radius:3px; flex:none}
.hl-btn{background:none; border:1px solid transparent; border-radius:999px; padding:3px 9px; cursor:pointer}
.hl-btn:hover{border-color:var(--rule-2)}
.hl-btn.on{border-color:var(--accent); background:var(--accent-wash); color:var(--ink); font-weight:600}
.hl-multi{border:1.4px solid var(--ink-2); background:var(--surface-2)}
.heat-stage{
  position:relative; height:min(62vh,640px); overflow:hidden; touch-action:none; cursor:grab;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg);
}
.heat-stage.grabbing{cursor:grabbing}
.heat-pan{position:absolute; top:0; left:0; transform-origin:0 0}
.heat-cell rect:first-child{transition:filter .1s}
.heat-cell.dim{opacity:.2}
.heat-cell:hover rect:first-child{filter:brightness(1.12)}
.m-panel{margin-bottom:12px; padding:0; overflow:hidden}
.vis-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:10px; padding:14px 16px;
  max-height:420px; overflow-y:auto}
.vis-col{border:1px solid var(--rule); border-radius:var(--r); overflow:hidden; background:var(--surface-2)}
.vis-head{display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--rule);
  font-size:12px; font-weight:600}
.vis-head .mono{margin-left:auto; font-size:10.5px; color:var(--ink-3); font-weight:400}
.vis-list{display:flex; flex-direction:column; gap:1px; padding:5px}
.vis-item{display:flex; align-items:center; gap:7px; width:100%; padding:4px 6px; cursor:pointer;
  background:none; border:1px solid transparent; border-radius:5px; text-align:left; opacity:.5}
.vis-item.on{opacity:1}
.vis-item:hover{background:var(--surface-3)}
.vis-eye{display:grid; flex:none; color:var(--ink-3)}
.vis-item.on .vis-eye{color:var(--accent)}
.vis-eye svg{width:13px; height:13px}
.vis-id{flex:none; width:78px; font-size:10.5px; color:var(--ink-2)}
.vis-name{flex:1; min-width:0; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mk-swatch{width:20px; height:20px; border-radius:5px; flex:none; margin-top:1px}
.mk-body{padding:14px 16px}
.mk-list{max-height:360px; overflow-y:auto; margin-top:9px; display:flex; flex-direction:column; gap:2px}
.mk-tac{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-3);
  margin:9px 0 3px; text-transform:uppercase}
.mk-item{display:flex; align-items:center; gap:8px; width:100%; padding:5px 8px; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r); text-align:left}
.mk-item:hover:not(:disabled){border-color:var(--ink-3)}
.mk-item:disabled{cursor:not-allowed; opacity:.85}
.mk-item.on{border-color:var(--accent)}
.mk-box{width:14px; height:14px; flex:none; border:1.5px solid var(--rule-2); border-radius:4px}
.mk-auto{margin-left:auto; flex:none; font-size:10px; font-family:var(--mono); color:var(--ink-3);
  padding:1px 6px; border:1px solid var(--rule); border-radius:999px}
.ly-list{display:flex; flex-direction:column; gap:8px; margin-top:8px}
.ly{display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:var(--r)}
.ly i{width:12px; height:22px; border-radius:3px; flex:none}
.sw-row{display:flex; gap:7px; flex-wrap:wrap}
.sw{width:26px; height:26px; border-radius:6px; cursor:pointer; background:var(--sw);
  border:2px solid transparent; box-shadow:0 0 0 1px var(--rule-2)}
.sw.on{border-color:var(--surface); box-shadow:0 0 0 2px var(--ink)}
.case-pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:7px}
.cp-item{display:flex; align-items:center; gap:8px; padding:7px 9px; cursor:pointer; text-align:left;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r); font-size:12.5px}
.cp-item:hover{border-color:var(--ink-3)}
.cp-item.on{border-color:var(--accent); background:var(--accent-wash)}
.cp-box{width:15px; height:15px; flex:none; display:grid; place-items:center; border-radius:4px;
  border:1.5px solid var(--rule-2); background:var(--surface)}
.cp-item.on .cp-box{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.cp-box svg{width:10px; height:10px; stroke-width:3}
.cp-item .bar{width:3px; align-self:stretch; border-radius:2px; flex:none}
.cp-txt{flex:1; min-width:0; line-height:1.35}
.cp-txt small{display:block; font-size:10.5px; color:var(--ink-3); font-family:var(--mono)}


.heat-cell.sub rect:first-of-type{stroke-dasharray:3 2}
.heat-exp:hover rect{stroke:var(--accent)}
.vis-item.sub{padding-left:20px}
.vis-item.sub .vis-id{width:70px; font-size:10px}
.mk-item.sub{margin-left:18px}
.tech.sub{padding-left:26px}
.tech.sub .tid{font-size:10.5px}


.newwrap{position:relative}
.newmenu{min-width:290px; right:22px; left:auto}



.hr-add{display:flex; gap:8px; align-items:center}
.hr-add .inp{flex:1}
.hr-list{display:flex; flex-direction:column; gap:9px; margin-top:11px}
.hr-item{padding:10px 11px; background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r)}
.hr-head{display:flex; align-items:center; gap:9px}
.hr-head .bar{width:3px; align-self:stretch; min-height:30px; border-radius:2px; flex:none}
.hr-link{flex:1; min-width:0; text-align:left; background:none; border:0; cursor:pointer;
  font-size:12.5px; color:var(--ink); line-height:1.4; padding:0}
.hr-link:hover{color:var(--accent)}
.hr-link small{display:block; font-size:10.5px; color:var(--ink-3); font-family:var(--mono)}
.hr-note{margin-top:8px; font-size:12px; padding:6px 9px}
.hr-extra{margin-top:13px; padding-top:12px; border-top:1px solid var(--rule)}

.mit-sec{border-left:2px solid var(--good)}
.mit-sec .reply-mark{color:var(--good)}

.risk-cols{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:14px; padding-top:13px; border-top:1px solid var(--rule)}
@media (max-width:900px){ .risk-cols{grid-template-columns:1fr} }
.risk-cols .risk-formula{margin-top:0; padding-top:0; border-top:0}
.rb-bar{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface-3); margin:8px 0 9px}
.rb-bar i{display:block; height:100%}
.rb-a{background:var(--data)} .rb-b{background:var(--serious)} .rb-f{background:var(--critical); opacity:.55}
.rb-keys{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-2)}
.rb-k{display:inline-flex; align-items:center; gap:6px}
.rb-k i{width:9px; height:9px; border-radius:2px; display:inline-block}
.rb-imp{display:flex; flex-direction:column; gap:5px; margin-top:7px}
.rbi{display:flex; align-items:center; gap:9px; font-size:11.5px}
.rbi-l{width:30px; flex:none; color:var(--ink-2)}
.rbi-t{flex:1; height:8px; border-radius:4px; background:var(--surface-3); overflow:hidden}
.rbi-t i{display:block; height:100%; border-radius:4px}
.rbi-n{width:46px; text-align:right; font-size:10.5px; color:var(--ink-3)}
.rb-crit{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.rb-chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--rule-2); border-radius:999px;
  font-family:var(--mono); font-size:11px; color:var(--ink)}
.rb-chip:hover{border-color:var(--critical); color:var(--critical)}
.rb-chip i{width:7px; height:7px; border-radius:50%}
.heat-home{position:relative; height:440px; overflow:hidden; touch-action:none; cursor:grab;
  margin-top:12px; background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r)}
.heat-home.grabbing{cursor:grabbing}
.heat-home .heat-pan{position:absolute; top:0; left:0; transform-origin:0 0}


.bottombar-wrap{padding-top:0; padding-bottom:26px}
.bottombar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 16px}
.bottombar .spacer{margin-left:auto}
.bb-hint{font-size:12px; color:var(--ink-3)}

/* ---------- 標籤篩選 ---------- */
.tagwrap{position:relative}
.tagbtn{display:inline-flex; align-items:center; gap:6px}
.tagbtn .caret{font-size:9px; opacity:.7}
.tagpanel{
  position:absolute; z-index:45; top:calc(100% + 6px); left:0; width:262px; padding:9px;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r-lg); box-shadow:var(--shadow-lg);
}
.tagsearch{padding:6px 9px; font-size:12.5px; margin-bottom:7px}
.taglist{max-height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:1px}
.tagopt{
  display:flex; align-items:center; gap:8px; width:100%; padding:5px 7px; cursor:pointer;
  background:none; border:1px solid transparent; border-radius:var(--r); text-align:left;
}
.tagopt:hover{background:var(--surface-2)}
.tagopt[aria-pressed="true"]{background:var(--accent-wash)}
.tagopt .box{width:14px; height:14px; flex:none; border:1.5px solid var(--rule-2); border-radius:3px; display:grid; place-items:center}
.tagopt[aria-pressed="true"] .box{background:var(--accent); border-color:var(--accent)}
.tagopt .box svg{width:9px; height:9px; stroke:var(--accent-ink); fill:none; stroke-width:3; opacity:0}
.tagopt[aria-pressed="true"] .box svg{opacity:1}
.tagopt-name{flex:1; font-family:var(--mono); font-size:11.5px; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis}
.tagopt-name{flex:none}
.tagopt-sub{flex:1; font-size:11px; color:var(--ink-3); min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.tagopt-n{font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.kind-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2);
  white-space:nowrap}
.kind-chip i{width:6px; height:6px; border-radius:50%; background:var(--kc); flex:none}
.tagfoot{display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--rule)}
.tagfoot .hint{flex:1; font-size:10.5px; color:var(--ink-3); line-height:1.4}
.tagbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:9px 16px; border-bottom:1px solid var(--rule)}
.tag-btn{border:0; cursor:pointer; font-family:var(--mono)}
.tag-btn:hover{background:var(--accent-wash); color:var(--accent)}
.tag-active{
  background:var(--accent); color:var(--accent-ink); cursor:pointer; border:0;
  display:inline-flex; align-items:center; gap:5px; font-family:var(--mono);
}
.tag-active .x{opacity:.75; font-size:13px; line-height:1}
.tag-active:hover .x{opacity:1}

/* ---------- 分頁 ---------- */
.pager{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 16px; border-top:1px solid var(--rule)}
.pg-count{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.pg-nums{display:flex; align-items:center; gap:3px}
.pg-btn,.pg-num{
  min-width:28px; height:28px; padding:0 7px; cursor:pointer; font-size:12.5px;
  display:grid; place-items:center; font-variant-numeric:tabular-nums;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r); color:var(--ink-2);
}
.pg-btn:hover:not(:disabled),.pg-num:hover{background:var(--surface-2); color:var(--ink); border-color:var(--ink-3)}
.pg-btn:disabled{opacity:.35; cursor:not-allowed}
.pg-num[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.pg-gap{color:var(--ink-3); padding:0 2px; font-size:12px}
.pg-per{display:flex; align-items:center; gap:6px; margin-left:auto; font-size:12px; color:var(--ink-3)}
.pg-select{
  padding:4px 7px; font-size:12.5px; background:var(--surface); color:var(--ink);
  border:1px solid var(--rule-2); border-radius:var(--r); cursor:pointer;
}
@media (max-width:680px){ .pg-per{margin-left:0; width:100%} }

.tbl-scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:940px}
th{
  text-align:left; padding:9px 12px; font-family:var(--mono); font-size:10.5px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  border-bottom:1px solid var(--rule); white-space:nowrap; background:var(--surface-2);
}
th.sortable{cursor:pointer; user-select:none; position:relative}
th.sortable:hover{color:var(--ink)}
th.sortable:hover .arrow::after{content:'↕'; opacity:.4}
th[data-active]{color:var(--accent)}
th .arrow{display:inline-block; margin-left:4px; min-width:8px}
td{padding:11px 12px; border-bottom:1px solid var(--rule); vertical-align:middle}
tbody tr{cursor:pointer; transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.sev-cell{width:3px; padding:0!important; border-bottom:1px solid var(--rule)}
.sev-cell i{display:block; width:3px; height:100%; min-height:44px}
.cid{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.ctitle{font-weight:500; line-height:1.45; max-width:400px}
.ctags{display:flex; gap:4px; margin-top:5px; flex-wrap:wrap}
.tnum{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink-2)}
.tnum b{color:var(--ink); font-weight:500}
.who{display:flex; align-items:center; gap:8px; white-space:nowrap}
.who .avatar{width:22px; height:22px; font-size:10px; background:var(--surface-3); color:var(--ink-2)}
.who span{font-size:12.5px}
.who small{display:block; font-size:10.5px; color:var(--ink-3); line-height:1.2}
.empty{padding:44px 20px; text-align:center; color:var(--ink-3)}

/* ---------- detail ---------- */
.detail{display:grid; grid-template-columns:1fr 340px; gap:16px; align-items:start}
.sec{padding:18px 20px}
.sec + .sec{margin-top:14px}
.sec h3{font-size:13.5px; margin-bottom:10px}
.prose{color:var(--ink-2); line-height:1.85; font-size:13.5px}
.prose p + p{margin-top:11px}
.callout{
  padding:13px 15px; background:var(--accent-wash); border-left:2px solid var(--accent);
  border-radius:0 var(--r) var(--r) 0; font-size:13.5px; line-height:1.8;
}
.shots{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.shot{
  border:1px solid var(--rule); border-radius:var(--r); overflow:hidden; background:var(--surface-2); cursor:pointer;
}
.shot:hover{border-color:var(--ink-3)}
.shot .thumb{height:104px; display:block; width:100%}
.shot .cap{padding:7px 9px; font-size:11.5px; color:var(--ink-2); border-top:1px solid var(--rule); line-height:1.45}
.meta{display:flex; flex-direction:column}
.meta .row{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--rule); font-size:13px}
.meta .row:last-child{border-bottom:0}
.meta .k{flex:none; width:88px; color:var(--ink-3); font-size:12px}
.meta .v{flex:1; min-width:0; word-break:break-word}
.flow{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-top:4px}
.node{padding:9px 11px; background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r)}
.node .lbl{font-size:10.5px; color:var(--ink-3); margin-bottom:2px}
.node .ip{font-family:var(--mono); font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums}
.node .host{font-size:11px; color:var(--ink-2); margin-top:1px}
.arrowline{display:grid; place-items:center; color:var(--ink-3)}
.arrowline svg{width:26px; height:14px; stroke:currentColor; fill:none; stroke-width:1.5}
.ioc{display:flex; flex-direction:column; gap:7px}
.ioc-row{display:flex; align-items:flex-start; gap:9px; padding:8px 10px; background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r)}
.ioc-type{
  flex:none; padding:1px 6px; border-radius:3px; background:var(--surface-3); color:var(--ink-2);
  font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; margin-top:2px;
}
.ioc-val{font-family:var(--mono); font-size:12px; word-break:break-all; line-height:1.5}
.ttp{display:flex; flex-direction:column; gap:6px}
.ttp-row{display:flex; align-items:baseline; gap:9px; font-size:12.5px}
.ttp-id{
  flex:none; font-family:var(--mono); font-size:11px; font-weight:500; color:var(--accent);
  padding:1px 6px; border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  border-radius:3px; background:var(--accent-wash);
}
.ttp-tac{font-size:10.5px; color:var(--ink-3); margin-left:auto; flex:none; font-family:var(--mono)}
.audit{display:flex; flex-direction:column; gap:0}
.au{display:flex; gap:11px; padding-bottom:14px; position:relative}
.au:not(:last-child)::before{content:""; position:absolute; left:4px; top:14px; bottom:0; width:1px; background:var(--rule-2)}
.au .pip{width:9px; height:9px; border-radius:50%; background:var(--rule-2); flex:none; margin-top:5px; z-index:1; border:2px solid var(--surface)}
.au.first .pip{background:var(--accent)}
.au .txt{font-size:12.5px; line-height:1.55}
.au .txt b{font-weight:500}
.au .when{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); display:block; margin-top:1px}
.linked{display:flex; flex-direction:column; gap:7px}
.link-case{
  display:flex; align-items:center; gap:9px; padding:9px 11px; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:var(--r); cursor:pointer; text-align:left; width:100%;
}
.link-case:hover{border-color:var(--ink-3); background:var(--surface-3)}
.link-case .bar{width:3px; align-self:stretch; border-radius:2px; flex:none}
.link-case .t{font-size:12.5px; line-height:1.4; flex:1; min-width:0}
.link-case .t small{display:block; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}

/* ---------- form ---------- */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px}
.field{display:flex; flex-direction:column; gap:5px}
.field.full{grid-column:1 / -1}
.field label{font-size:12px; font-weight:500; color:var(--ink-2)}
.field label .req{color:var(--critical); margin-left:2px}
.field .hint{font-size:11px; color:var(--ink-3)}
.inp{
  padding:8px 11px; background:var(--surface-2); border:1px solid var(--rule-2);
  border-radius:var(--r); font-size:13px; width:100%;
}
.inp:focus{border-color:var(--accent); background:var(--surface)}
.inp[readonly]{background:var(--surface-3); color:var(--ink-3); cursor:not-allowed}
.inp.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
textarea.inp{resize:vertical; min-height:150px; line-height:1.8; font-family:var(--sans)}
.radios{display:flex; gap:8px; flex-wrap:wrap}
.radio{
  display:inline-flex; align-items:center; gap:7px; padding:6px 12px; cursor:pointer;
  border:1px solid var(--rule-2); border-radius:999px; font-size:12.5px; background:var(--surface-2);
}
.radio:hover{border-color:var(--ink-3)}
.radio input{position:absolute; opacity:0; width:0; height:0}
.radio .mark{width:12px; height:12px; border-radius:50%; border:1.5px solid var(--rule-2); flex:none; position:relative}
.radio:has(input:checked){border-color:var(--accent); background:var(--accent-wash); font-weight:500}
.radio:has(input:checked) .mark{border-color:var(--accent)}
.radio:has(input:checked) .mark::after{content:""; position:absolute; inset:2px; border-radius:50%; background:var(--accent)}
.radio:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
.pair{display:grid; grid-template-columns:1fr 96px; gap:8px}
.rowlist{display:flex; flex-direction:column; gap:8px}
.rowitem{display:grid; grid-template-columns:104px 1fr auto; gap:8px; align-items:center}
.chiplist{
  display:flex; flex-wrap:wrap; gap:6px; padding:7px 9px; min-height:40px;
  background:var(--surface-2); border:1px solid var(--rule-2); border-radius:var(--r); align-items:center;
}
.chiplist .tag{padding:3px 7px; font-size:11.5px; gap:5px; display:inline-flex; align-items:center}
.chiplist .tag button{background:none; border:0; padding:0; cursor:pointer; color:var(--ink-3); display:grid; place-items:center}
.chiplist .tag button:hover{color:var(--critical)}
.chiplist input{flex:1; min-width:90px; background:none; border:0; outline:none; font-size:12.5px}
.drop{
  border:1.5px dashed var(--rule-2); border-radius:var(--r-lg); padding:24px; text-align:center;
  color:var(--ink-3); cursor:pointer; background:var(--surface-2); transition:border-color .12s, background .12s;
}
.drop:hover{border-color:var(--accent); background:var(--accent-wash); color:var(--ink-2)}
.drop svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.5; margin-bottom:6px}
.sticky-actions{
  position:sticky; bottom:0; display:flex; align-items:center; gap:10px; margin-top:16px;
  padding:13px 20px; background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-lg); box-shadow:var(--shadow-lg);
}
.sticky-actions .spacer{margin-left:auto}
.sticky-actions .note{font-size:11.5px; color:var(--ink-3)}

/* ---------- login ---------- */
.login-page{min-height:100vh; display:grid; grid-template-columns:1fr 1fr}
.login-art{position:relative; background:var(--accent); overflow:hidden; display:none}
.login-art canvas{position:absolute; inset:0; width:100%; height:100%}
.login-art .quote{position:absolute; left:44px; right:44px; bottom:44px; color:#fff}
.login-art .quote p{font-size:19px; line-height:1.65; font-weight:500; max-width:26ch; text-wrap:balance}
.login-art .quote .eyebrow{color:rgba(255,255,255,.62); margin-bottom:12px}
.login-form-side{display:grid; place-items:center; padding:32px}
.login-box{width:100%; max-width:352px}
.login-box .brand{margin-bottom:26px; cursor:default}
.login-box h2{font-size:19px; margin-bottom:5px; letter-spacing:-.015em}
.login-box .lead{color:var(--ink-2); font-size:13px; margin-bottom:22px}
.login-box .field{margin-bottom:13px}
.login-box .btn{width:100%; justify-content:center; padding:9px}
.or{display:flex; align-items:center; gap:11px; margin:17px 0; color:var(--ink-3); font-size:11.5px}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--rule)}
.sso-note{margin-top:9px; font-size:11.5px; color:var(--ink-3); line-height:1.6}
.login-err{
  margin:0 0 11px; padding:8px 11px; font-size:12px; line-height:1.6;
  color:var(--critical); background:color-mix(in srgb,var(--critical) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--critical) 38%,transparent); border-radius:var(--r);
}
.accounts{margin-top:26px; padding-top:18px; border-top:1px solid var(--rule)}
.acct{
  display:grid; grid-template-columns:22px 1fr auto auto; align-items:center; gap:10px;
  width:100%; padding:7px 9px; margin-bottom:4px; text-align:left; cursor:pointer;
  background:none; border:1px solid transparent; border-radius:var(--r);
}
.acct:hover{background:var(--surface-2); border-color:var(--rule)}
.acct-who{font-size:12.5px; line-height:1.3; min-width:0}
.acct-who small{display:block; font-size:10.5px; color:var(--ink-3)}
.acct-cred{font-family:var(--mono); font-size:11.5px; line-height:1.3; text-align:right; color:var(--ink-2)}
.acct-cred small{display:block; font-size:10.5px; color:var(--ink-3)}
.acct-perm{
  font-size:10.5px; color:var(--ink-3); padding:1px 7px;
  border:1px solid var(--rule); border-radius:999px; white-space:nowrap;
}
@media (max-width:520px){ .acct{grid-template-columns:22px 1fr auto} .acct-perm{display:none} }
@media (min-width:900px){.login-art{display:block}}

/* ---------- modal / menu / toast ---------- */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(15,22,32,.45); backdrop-filter:blur(2px); display:grid; place-items:center; padding:24px}
.modal{width:100%; max-width:560px; max-height:82vh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r-lg); box-shadow:var(--shadow-lg)}
.modal-head{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--rule)}
.modal-head h3{font-size:14.5px}
.modal-head .iconbtn{margin-left:auto}
.modal-body{padding:16px 18px; overflow-y:auto}
.modal-foot{display:flex; gap:9px; padding:13px 18px; border-top:1px solid var(--rule); background:var(--surface-2); border-radius:0 0 var(--r-lg) var(--r-lg)}
.modal-foot .spacer{margin-left:auto}
.menu{
  position:fixed; right:22px; top:52px; z-index:50; min-width:246px; padding:5px;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r-lg); box-shadow:var(--shadow-lg);

/* 分析員標註：預設由案件報告的 TTP 直接帶入，不重覆輸入；
   TTP_MARKS 只存分析員額外加註或改色的部分。 */
const TTP_MARKS=[];
function analystTtps(){
  const m=new Map();
  CASES.forEach(c=>{
    (DETAIL[c.id]?.ttps||[]).forEach(t=>{
      if(!m.has(t.id)) m.set(t.id,{cases:[], manual:false});
      m.get(t.id).cases.push(c.id);
    });
  });
  TTP_MARKS.forEach(x=>{
    if(!m.has(x.ttp)) m.set(x.ttp,{cases:[], manual:true, note:x.note});
    else m.get(x.ttp).manual=true;
  });
  return m;
}

/* 案件系統的 TTP 選擇器沿用同一份來源：母技術與子技術一併列出 */
const ATTACK = ATTACK_FULL.map(t=>({tac:`${t.id} ${t.name}`,
  techs:t.techs.flatMap(x=>[[x.id,x.name],...x.subs.map(sb=>[sb.id, x.name+'：'+sb.name])])}));
const TECH_INDEX = (()=>{ const m={};
  ATTACK_FULL.forEach(t=>t.techs.forEach(x=>{
    if(!m[x.id]) m[x.id]={id:x.id, name:x.name, common:x.common, tacticId:t.id, tacticName:t.name, isSub:false};
    x.subs.forEach(sb=>{ if(!m[sb.id]) m[sb.id]={id:sb.id, name:x.name+'：'+sb.name, common:sb.common,
      tacticId:t.id, tacticName:t.name, isSub:true, parent:x.id}; });
  }));
  return m; })();
const TTP_HIDDEN = {};
function techVisible(tacticId, techId){
  const k=tacticId+'|'+techId;
  if(k in TTP_HIDDEN) return !TTP_HIDDEN[k];
  const t=ATTACK_FULL.find(x=>x.id===tacticId); if(!t) return true;
  for(const x of t.techs){
    if(x.id===techId) return !!x.common;
    const sb=x.subs.find(y=>y.id===techId);
    if(sb) return !!sb.common;
  }
  return true;
}
/* 母技術在熱圖上的圖層＝自身＋所有子技術的聯集，收合時才看得出這一支有沒有被標到 */
const subIdsOf = (tacticId, pid) => {
  const t=ATTACK_FULL.find(x=>x.id===tacticId); if(!t) return [];
  const p=t.techs.find(x=>x.id===pid);
  return p ? p.subs.map(s=>s.id) : [];
};

   連結只放行 http(s) 與站內錨點。
   ============================================================ */
const mdEsc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mdUrl = u => /^(https?:\/\/|#|\/)/i.test(u) ? u : '#';

function mdInline(src){
  let s=mdEsc(src);
  const code=[];
  s=s.replace(/`([^`]+)`/g,(m,p)=>{code.push(p); return `\u0000${code.length-1}\u0000`;});
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>`<img src="${mdUrl(u)}" alt="${a}">`);
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (m,t,u)=>`<a href="${mdUrl(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${code[i]}</code>`);
  return s;
}

function md(src){
  const lines=String(src||'').replace(/\r\n?/g,'\n').split('\n');
  const BLOCK=/^(#{1,4}\s|>|```|\s*[-*+]\s|\s*\d+[.)]\s|(-{3,}|\*{3,})\s*$)/;
  let out='', i=0, list=null;
  const shut=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L)){
      shut(); i++; const buf=[];
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out+=`<pre><code>${mdEsc(buf.join('\n'))}</code></pre>`; continue;
    }
    if(/^\s*$/.test(L)){ shut(); i++; continue; }
    if(/^(-{3,}|\*{3,})\s*$/.test(L)){ shut(); out+='<hr>'; i++; continue; }
    let m;
    if((m=L.match(/^(#{1,4})\s+(.*)$/))){
      shut(); const lv=Math.min(6,m[1].length+2);
      out+=`<h${lv}>${mdInline(m[2])}</h${lv}>`; i++; continue;
    }
    if(/^>\s?/.test(L)){
      shut(); const buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,''));
      out+=`<blockquote>${md(buf.join('\n'))}</blockquote>`; continue;
    }
    if((m=L.match(/^\s*[-*+]\s+(.*)$/))){
      if(list!=='ul'){ shut(); out+='<ul>'; list='ul'; }
      out+=`<li>${mdInline(m[1])}</li>`; i++; continue;
    }
    if((m=L.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(list!=='ol'){ shut(); out+='<ol>'; list='ol'; }
      out+=`<li>${mdInline(m[1])}</li>`; i++; continue;
    }
    shut();
    const buf=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !BLOCK.test(lines[i])) buf.push(lines[i++]);
    out+=`<p>${mdInline(buf.join('\n')).replace(/\n/g,'<br>')}</p>`;
  }
  shut();
  return out;
}

  const t=$('#toast'); $('#toast-msg').textContent=msg;

/* 點外面關閉：一定要記住 handler 並在關閉時解除。
   否則選單關掉後監聽器還掛在 document 上，下一次點擊（例如點 ⓘ）
   會在開啟的同一瞬間把新開的東西關掉。 */
let outsideCloser=null;
function armOutsideClose(){
  disarmOutsideClose();
  outsideCloser=()=>closeOverlay();
  setTimeout(()=>{ if(outsideCloser) document.addEventListener('click', outsideCloser, {once:true}); },0);
}
function disarmOutsideClose(){
  if(outsideCloser){ document.removeEventListener('click', outsideCloser); outsideCloser=null; }
}
function closeOverlay(){ disarmOutsideClose(); $('#overlay').innerHTML=''; }

  const err=$('#lg-err'), btn=$('#lg-btn');

function drawLoginArt(){
  const c=$('#art'); if(!c)return;
  const r=c.parentElement.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr);
  // A quiet connection graph — nodes and the few edges between them.
  const N=54, pts=[];
  for(let i=0;i<N;i++) pts.push({x:Math.random()*r.width, y:Math.random()*r.height, s:Math.random()*1.9+0.7});
  x.strokeStyle='rgba(255,255,255,.15)'; x.lineWidth=1;
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
    const d=Math.hypot(pts[i].x-pts[j].x, pts[i].y-pts[j].y);
    if(d<118){ x.globalAlpha=1-d/118; x.beginPath(); x.moveTo(pts[i].x,pts[i].y); x.lineTo(pts[j].x,pts[j].y); x.stroke(); }
  }
  x.globalAlpha=1;
  pts.forEach((p,i)=>{ x.fillStyle= i%9===0 ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.45)';
    x.beginPath(); x.arc(p.x,p.y,p.s,0,7); x.fill(); });
}

/* 高危案件時間軸：只收「危急」與「高」。圓點位置依案發時間等比映射（時間軸要誠實），
   卡片則以「通道打包」擺放 — 依時序逐一放進第一個放得下的通道（上0、下0、上1、下1…），
   所以案件時間再近也不會重疊，只會往外側疊。通道數決定容器高度。 */
const TL_CARD_W=168, TL_GAP=10, TL_CARD_H=58, TL_RING=TL_CARD_H+10, TL_BASE=34;

const TL_MAX=12;   // 只看最近幾件，否則通道越疊越多，面板會高到失去「一眼掃過」的作用
function timelineItems(){
  const ts=s=>new Date(s.replace(' ','T')).getTime();
  return CASES.filter(c=>c.sev==='危急'||c.sev==='高')
    .map(c=>({c, t:ts(c.occur[0])}))
    .sort((a,b)=>a.t-b.t)
    .slice(-TL_MAX);
}

function timeline(){
  const items=timelineItems();
  const tl=el('div',{class:'tl'});
  if(!items.length){
    tl.append(el('p',{style:'position:absolute;top:50%;left:0;transform:translateY(-50%);font-size:12.5px;color:var(--ink-3)'},
      '目前沒有「高」以上的案件。'));
    return tl;
  }
  tl.append(
    el('div',{class:'tl-axis'}),
    el('div',{class:'tl-end', style:'left:0'}, items[0].c.occur[0].slice(0,10)),
    el('div',{class:'tl-end', style:'right:18px;text-align:right'}, items[items.length-1].c.occur[0].slice(0,10)));

  items.forEach(({c})=>{
    tl.append(el('div',{class:'tl-node'},
      el('div',{class:'tl-stem'}),
      el('div',{class:'tl-dot', style:`background:${SEV_COLOR[c.sev]}`}),
      el('button',{class:'tl-card', style:`border-left-color:${SEV_COLOR[c.sev]}`,
        title:`${c.title}（${c.sev}·${c.occur[0]}）`, onclick:()=>go('detail',c.id)},
        el('div',{class:'t'},c.title),
        el('div',{class:'m'},
          el('i',{style:`background:${SEV_COLOR[c.sev]}`}), c.sev, '·', c.occur[0].slice(5,16)))));
  });
  return tl;
}

/* 量到實際寬度後才排版；視窗改變時重跑。 */
function layoutTimeline(){
  const tl=$('.tl'); if(!tl)return;
  const nodes=[...tl.querySelectorAll('.tl-node')];
  if(!nodes.length)return;
  const items=timelineItems();
  if(items.length!==nodes.length)return;

  const W=tl.clientWidth||760;
  const t0=items[0].t, t1=items[items.length-1].t, span=(t1-t0)||1;
  const lanes=[];                       // lanes[i] = 已佔用的 [左,右] 區間
  let maxUp=0, maxDown=0;                // 上下各自的通道數，決定軸線該擺在哪

  items.forEach(({t}, i)=>{
    const node=nodes[i];
    const x=Math.round((16 + ((t-t0)/span)*(W-32)));         // 圓點：真實時間位置
    const left=Math.max(0, Math.min(W-TL_CARD_W, x-TL_CARD_W/2)); // 卡片：置中並夾在容器內
    let lane=0;
    while(true){
      const used=lanes[lane]||(lanes[lane]=[]);
      if(used.every(([a,b])=> left+TL_CARD_W+TL_GAP<=a || left>=b+TL_GAP)){
        used.push([left,left+TL_CARD_W]); break;
      }
      lane++;
    }
    const ring=Math.floor(lane/2), up=lane%2===0;
    if(up) maxUp=Math.max(maxUp,ring); else maxDown=Math.max(maxDown,ring);

    node.style.left=x+'px';
    node.className='tl-node '+(up?'up':'down');
    const card=node.querySelector('.tl-card');
    card.style.left=(left-x)+'px';                            // 相對圓點
    const off=TL_BASE+ring*TL_RING;
    card.style[up?'bottom':'top']=off+'px';
    card.style[up?'top':'bottom']='auto';
    const stem=node.querySelector('.tl-stem');
    stem.style.height=(off-8)+'px';
    stem.style[up?'bottom':'top']='8px';
    stem.style[up?'top':'bottom']='auto';
  });

  // 上下分開量，避免某一側沒用到的通道變成整片留白
  const above=TL_BASE+maxUp*TL_RING+TL_CARD_H+12;
  const below=TL_BASE+maxDown*TL_RING+TL_CARD_H+12;
  tl.style.setProperty('--axis-y', above+'px');
  tl.style.height=(above+below)+'px';
}

/* 各欄位的排序鍵：有序類別用自訂次序，其餘用字串比較 */
const SORT_KEY = {
  id:      c=>c.id,
  title:   c=>c.title,
  occur:   c=>c.occur[0],
  created: c=>c.created,
  sev:     c=>SEV_ORDER[c.sev],
  verdict: c=>VERDICT_ORDER[c.verdict] ?? 9,
  progress:c=>PROGRESS_ORDER[c.progress] ?? 9,
  cat:     c=>c.cat,
  analyst: c=>(USERS[c.analyst]||{}).name||'',
};
/* 嚴重度、結果、進度的序號越小代表越嚴重／越前面，
   所以「遞減」對使用者的直覺是「最嚴重排最上面」＝序號遞增。 */
const SORT_INVERTED = {sev:1, verdict:1, progress:1};

function allTags(){
  const m=new Map();
  CASES.forEach(c=>c.tags.forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
}

function filtered(){
  const q=S.q.trim().toLowerCase();
  const rows=CASES.filter(c=>{
    if(S.fProgress!=='全部'&&c.progress!==S.fProgress)return false;
    if(S.fVerdict!=='全部'&&c.verdict!==S.fVerdict)return false;
    if(S.fSev!=='全部'&&c.sev!==S.fSev)return false;
    if(S.fTags.length && !S.fTags.some(t=>c.tags.includes(t))) return false;
    if(!q)return true;
    const net=c.conns.flatMap(n=>[n.src,n.srcPort,n.dst,n.dstPort,n.dstHost,n.note]);
    const d=DETAIL[c.id]||{};
    return [c.id,c.title,c.host,c.hostUser,c.cat,...net,...c.tags,d.mitigation||'',
      (USERS[c.analyst]||{}).name||''].join(' ').toLowerCase().includes(q);
  });
  const get=SORT_KEY[S.sortBy]||SORT_KEY.occur;
  let dir=S.sortDir==='desc'?-1:1;
  if(SORT_INVERTED[S.sortBy]) dir*=-1;
  const coll=new Intl.Collator('zh-Hant',{numeric:true});
  rows.sort((a,b)=>{
    const av=get(a), bv=get(b);
    const r = (typeof av==='number') ? av-bv : coll.compare(av,bv);
    return r*dir || coll.compare(a.id,b.id);
  });
  return rows;
}

/* 兩套系統共用同一個分頁列 */
function pagerInto(hostSel, total, pages, start, shown, per, onPage, onPer, cur){
  const host=$(hostSel); if(!host)return;
  host.innerHTML='';
  const go1=p=>onPage(Math.min(Math.max(1,p),pages));

  host.append(el('div',{class:'pg-count'},
    total ? `顯示第 ${start+1}–${start+shown} 筆，共 ${total} 筆` : '無符合的案件'));

  if(pages>1){
    const nums=[];
    const push=p=>nums.push(el('button',{class:'pg-num','aria-current':String(p===cur),
      onclick:()=>go1(p)}, String(p)));
    const gap=()=>nums.push(el('span',{class:'pg-gap'},'…'));
    // 首頁、末頁與目前頁附近永遠可見，其餘省略
    const near=new Set([1,pages,cur-1,cur,cur+1]);
    if(cur<=3) [1,2,3,4].forEach(p=>near.add(p));
    if(cur>=pages-2) [pages-3,pages-2,pages-1,pages].forEach(p=>near.add(p));
    let last=0;
    [...near].filter(p=>p>=1&&p<=pages).sort((a,b)=>a-b).forEach(p=>{
      if(p-last>1) gap();
      push(p); last=p;
    });
    host.append(

function tagFilter(){

      onclick:e=>{ e.stopPropagation(); toggleTagPanel(); }},

      el('span',{class:'caret'},'▾')),
    el('div',{class:'tagpanel hidden', id:'tagpanel', onclick:e=>e.stopPropagation()},
      el('input',{class:'inp tagsearch', id:'tagsearch', placeholder:'搜尋標籤…',
        oninput:paintTagPanel}),
      el('div',{class:'taglist', id:'taglist'}),
      el('div',{class:'tagfoot'},
        el('span',{class:'hint', id:'tagmode'}),
        el('button',{class:'btn btn-sm', onclick:()=>{ S.fTags=[]; S.page=1;
          refreshFilters(); refreshTable(); paintTagPanel(); }},'清除'))));
}
function toggleTagPanel(){
  const p=$('#tagpanel'); if(!p)return;
  const open=p.classList.toggle('hidden')===false;
  if(open){
    paintTagPanel();
    $('#tagsearch').focus();
    setTimeout(()=>document.addEventListener('click', closeTagPanel, {once:true}),0);
  }
}
function closeTagPanel(){ const p=$('#tagpanel'); if(p) p.classList.add('hidden'); }
function paintTagPanel(){
  const list=$('#taglist'); if(!list)return;
  const q=($('#tagsearch')?.value||'').trim().toLowerCase();
  const tags=allTags().filter(([t])=>!q||t.toLowerCase().includes(q));
  list.innerHTML='';
  if(!tags.length){ list.append(el('p',{class:'hint', style:'padding:8px 4px'},'查無符合的標籤。')); }
  tags.forEach(([t,n])=>{
    const on=S.fTags.includes(t);
    list.append(el('button',{class:'tagopt','aria-pressed':String(on), onclick:()=>toggleTag(t)},
      el('span',{class:'box', html:`<svg viewBox="0 0 24 24">${I.check}</svg>`}),
      el('span',{class:'tagopt-name'},'#'+t),
      el('span',{class:'tagopt-n'},String(n))));
  });
  const mode=$('#tagmode');
  if(mode) mode.textContent = S.fTags.length>1 ? `已選 ${S.fTags.length} 個 · 符合任一即列出` : '可多選，符合任一即列出';
  renderTagBar();
}
function renderTagBar(){
  const bar=$('#tagbar'); if(!bar)return;
  bar.innerHTML='';
  if(!S.fTags.length){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.append(el('span',{class:'eyebrow'},'標籤篩選'),
    ...S.fTags.map(t=>el('button',{class:'tag tag-active', title:'移除此標籤', onclick:()=>toggleTag(t)},
      '#'+t, el('span',{class:'x'},'×'))),
    el('button',{class:'btn btn-sm', style:'margin-left:auto',
      onclick:()=>{S.fTags=[]; S.page=1; refreshFilters(); refreshTable(); renderTagBar();}},'全部清除'));
}

function toggleTag(t){
  const i=S.fTags.indexOf(t);
  if(i<0) S.fTags.push(t); else S.fTags.splice(i,1);
  S.page=1; refreshFilters(); refreshTable();
  if($('#taglist')) paintTagPanel(); else renderTagBar();
}

/* ============================================================
   CHARTS
   ============================================================ */
const CSSVAR = n => getComputedStyle(document.body).getPropertyValue(n).trim();
const S_NS='http://www.w3.org/2000/svg';
const sv=(t,a={})=>{const n=document.createElementNS(S_NS,t); for(const[k,v]of Object.entries(a))n.setAttribute(k,v); return n;};

function drawCharts(){ drawTrend(); drawVerdict(); drawTactics(); layoutTimeline(); }

function drawTrend(){
  const host=$('#ch-trend'); if(!host)return;
  const tip=$('#tip-trend');
  host.querySelectorAll('svg').forEach(n=>n.remove());
  const W=host.clientWidth||600, H=Math.max(210,host.clientHeight||210), P={t:12,r:12,b:26,l:30};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, max=6;
  const X=i=>P.l+(iw*i)/(TREND.length-1), Y=v=>P.t+ih-(ih*v)/max;
  const s=sv('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,id:'chart-case-trend',role:'img','aria-label':'近 14 日案件量趨勢折線圖'});

  for(let g=0; g<=3; g++){
    const y=P.t+(ih*g)/3, v=max-(max*g)/3;
    s.append(sv('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,stroke:CSSVAR('--grid'),'stroke-width':1}));
    const tx=sv('text',{x:P.l-8,y:y+3.5,'text-anchor':'end','font-size':10,fill:CSSVAR('--ink-3'),'font-family':'IBM Plex Mono, monospace'});
    tx.textContent=v; s.append(tx);
  }
  const areaD=TREND.map((d,i)=>`${i?'L':'M'}${X(i)},${Y(d.v)}`).join(' ')+` L${X(TREND.length-1)},${P.t+ih} L${P.l},${P.t+ih} Z`;
  s.append(sv('path',{d:areaD, fill:CSSVAR('--data-fill'), stroke:'none'}));
  s.append(sv('path',{d:TREND.map((d,i)=>`${i?'L':'M'}${X(i)},${Y(d.v)}`).join(' '),
    fill:'none', stroke:CSSVAR('--data'), 'stroke-width':2, 'stroke-linejoin':'round','stroke-linecap':'round'}));
  s.append(sv('line',{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih,stroke:CSSVAR('--axis'),'stroke-width':1}));

  TREND.forEach((d,i)=>{ if(i%3===0||i===TREND.length-1){
    const tx=sv('text',{x:X(i),y:H-8,'text-anchor':'middle','font-size':10,fill:CSSVAR('--ink-3'),'font-family':'IBM Plex Mono, monospace'});
    tx.textContent=d.d; s.append(tx); }});

  // emphasised endpoint
  const li=TREND.length-1;
  s.append(sv('circle',{cx:X(li),cy:Y(TREND[li].v),r:4.5,fill:CSSVAR('--data'),stroke:CSSVAR('--surface'),'stroke-width':2}));

  const cross=sv('line',{x1:0,x2:0,y1:P.t,y2:P.t+ih,stroke:CSSVAR('--axis'),'stroke-width':1,opacity:0});
  const dot=sv('circle',{r:4.5,fill:CSSVAR('--data'),stroke:CSSVAR('--surface'),'stroke-width':2,opacity:0});
  s.append(cross,dot);
  s.append(sv('rect',{x:P.l,y:P.t,width:iw,height:ih,fill:'transparent'}));
  s.addEventListener('mousemove',e=>{
    const r=s.getBoundingClientRect();
    let i=Math.round(((e.clientX-r.left)-P.l)/(iw/(TREND.length-1)));
    i=Math.max(0,Math.min(TREND.length-1,i));
    const x=X(i), y=Y(TREND[i].v);
    cross.setAttribute('x1',x); cross.setAttribute('x2',x); cross.setAttribute('opacity',1);
    dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('opacity',1);
    tip.innerHTML=`<div class="t-d">2026-${TREND[i].d}</div><div class="t-v">${TREND[i].v} 件</div>`;
    tip.style.left=x+'px'; tip.style.top=(y-12)+'px'; tip.style.opacity=1;
  });
  s.addEventListener('mouseleave',()=>{cross.setAttribute('opacity',0);dot.setAttribute('opacity',0);tip.style.opacity=0;});
  host.append(s);
}

function drawVerdict(){
  const host=$('#ch-verdict'); if(!host)return;
  host.innerHTML='';
  const W=host.clientWidth||300, H=34, total=VERDICT_DIST.reduce((a,b)=>a+b.v,0), gap=2;
  const s=sv('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,id:'chart-case-verdict',role:'img','aria-label':'調查結果分佈長條圖'});
  let x=0;
  VERDICT_DIST.forEach((d,i)=>{
    const w=Math.max(0,(W*d.v)/total-(i<VERDICT_DIST.length-1?gap:0));
    const r=sv('rect',{x,y:0,width:w,height:H,rx:3,fill:d.c});
    const ttl=sv('title'); ttl.textContent=`${d.k} ${d.v} 件`; r.append(ttl);
    s.append(r); x+=w+gap;
  });
  host.append(s);
  const lg=$('#lg-verdict'); lg.innerHTML='';
  VERDICT_DIST.forEach(d=>lg.append(el('span',{class:'lg'},
    el('i',{style:`background:${d.c}`}),
    el('span',{},d.k), el('b',{},`${d.v} · ${(d.v/total*100).toFixed(0)}%`))));
}

function drawTactics(){
  const host=$('#ch-tactics'); if(!host)return;
  const tip=$('#tip-tactics');
  host.querySelectorAll('svg').forEach(n=>n.remove());
  const W=host.clientWidth||300, rowH=30, H=TACTICS.length*rowH, labelW=76, valW=30;
  const bw=W-labelW-valW, max=Math.max(...TACTICS.map(t=>t.v));
  const s=sv('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,id:'chart-case-tactics',role:'img','aria-label':'MITRE 戰術命中次數長條圖'});
  TACTICS.forEach((t,i)=>{
    const y=i*rowH+6, h=15, w=Math.max(2,(bw*t.v)/max);
    const lb=sv('text',{x:0,y:y+h-3,'font-size':11.5,fill:CSSVAR('--ink-2')});
    lb.textContent=t.k; s.append(lb);
    s.append(sv('rect',{x:labelW,y,width:bw,height:h,rx:3,fill:CSSVAR('--surface-3')}));
    const bar=sv('rect',{x:labelW,y,width:w,height:h,rx:3,fill:CSSVAR('--data')});
    s.append(bar);
    const vl=sv('text',{x:W,y:y+h-3,'text-anchor':'end','font-size':11.5,fill:CSSVAR('--ink'),
      'font-family':'IBM Plex Mono, monospace','font-weight':500});
    vl.textContent=t.v; s.append(vl);
    const hit=sv('rect',{x:0,y:i*rowH,width:W,height:rowH,fill:'transparent'});
    hit.addEventListener('mouseenter',()=>{
      bar.setAttribute('opacity','.75');
      tip.innerHTML=`<div class="t-d">${t.id}</div><div class="t-v">${t.k} · ${t.v} 次</div>`;
      tip.style.left=(labelW+w/2)+'px'; tip.style.top=(i*rowH)+'px'; tip.style.opacity=1;
    });
    hit.addEventListener('mouseleave',()=>{bar.setAttribute('opacity','1'); tip.style.opacity=0;});
    s.append(hit);
  });
  host.append(s);
}
let rt; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(drawCharts,140);});
